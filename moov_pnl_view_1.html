<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MOOV P&L Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* ── Palette: Soft Grey / Weiss / Pastell-Verlaeufe ── */
  --canvas:#EDEDEB;--ink:#1A1A19;
  --mint:#B8E6D0;--coral:#FFC4B8;--butter:#FFE9B0;--lavender:#DEDCF2;--skyp:#C9E0F5;
  --bg:#EDEDEB;
  --sur:#FFFFFF;
  --sur2:#F5F5F4;
  --sur3:#EDEDEB;
  --bd:#E9E9E7;
  --bds:#D8D8D6;
  --tx:#1A1A19;
  --tx2:#767674;
  --tx3:#A3A3A1;
  --teal:#1A1A19;
  --teal-b:rgba(26,26,25,.28);
  --teal-d:rgba(26,26,25,.06);
  --td:rgba(26,26,25,.10);
  --tb:rgba(26,26,25,.24);
  --accent:#1A1A19;
  --green:#3F7A5A;
  --gd:#DFF0E6;
  --red:#B4544A;
  --rd:#FBE3DF;
  --lo-bg:#FBE3DF;
  --lo-c:#B4544A;
  --amber:#9A7B2E;
  --ad:#FBF0DC;
  --blue:#4A6FB5;
  --bld:#E6EAF5;
  --shadow:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 8px 30px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.04);
  --sh:0 1px 2px rgba(0,0,0,.04);
  --shm:0 8px 30px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.04);
}
html,body{background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px;}
/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:18px;background:var(--sur2);border-radius:11px;padding:4px;border:1px solid var(--bd);}
.tab{flex:1;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:7px 10px;border-radius:8px;border:none;background:transparent;color:var(--tx2);cursor:pointer;transition:all .15s;text-align:center;}
.tab.on{background:var(--sur);color:var(--tx);box-shadow:var(--sh);font-weight:600;}
/* VIEWS */
.view{display:none;}.view.on{display:block;}
/* CARDS */
.rc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.rc{background:var(--sur);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;box-shadow:var(--sh);}
.rc-lbl{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);margin-bottom:4px;}
.rc-val{font-size:18px;font-weight:700;letter-spacing:-.02em;}
.rc-sub{font-size:11px;color:var(--tx2);margin-top:2px;}
.rc.pos .rc-val{color:var(--green);}
.rc.neg .rc-val{color:var(--red);}
.rc.amber .rc-val{color:var(--amber);}
/* COST BAR */
.cost-bar-wrap{background:var(--sur);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--sh);}
.cost-bar-title{font-size:13px;font-weight:600;margin-bottom:8px;}
.cost-bar{height:22px;border-radius:6px;overflow:hidden;display:flex;margin-bottom:8px;}
.cost-bar-seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;transition:width .4s;}
#cost-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--tx2);}
/* CHARTS */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.chart-card{background:var(--sur);border:1px solid var(--bd);border-radius:12px;padding:14px;box-shadow:var(--sh);}
.chart-title{font-size:12px;font-weight:600;color:var(--tx);margin-bottom:10px;}
.chart-wrap{height:180px;position:relative;}
/* FORM */
.form-card{background:var(--sur);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);}
.wk-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.wk-title{font-size:16px;font-weight:700;letter-spacing:-.02em;}
.inp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;}
.inp-row{display:flex;flex-direction:column;gap:4px;}
.inp-lbl{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);}
.inp{width:100%;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;color:var(--tx);background:var(--sur2);border:1.5px solid var(--bd);border-radius:8px;padding:8px 10px;outline:none;transition:border-color .15s;}
.inp:focus{border-color:var(--teal);background:#fff;}
.btn{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;border-radius:8px;border:1.5px solid var(--bd);background:var(--sur);color:var(--tx2);cursor:pointer;transition:all .13s;}
.btn:hover{border-color:var(--bds);color:var(--tx);}
.btn-p{background:var(--teal);border-color:var(--teal);color:#fff;}
.btn-p:hover{background:#000000;}
.btn-d{color:var(--red);border-color:rgba(201,65,79,.2);background:rgba(201,65,79,.04);}
/* FIX CHIPS */
.fix-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--sur2);border:1px solid var(--bd);color:var(--tx2);}
/* WEEK SELECT */
.sel-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.wk-sel{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;background:var(--sur2);border:1.5px solid var(--bd);border-radius:8px;padding:6px 10px;color:var(--tx);cursor:pointer;outline:none;}
/* HISTORY */
.history-card{background:var(--sur);border:1px solid var(--bd);border-radius:12px;overflow:hidden;box-shadow:var(--sh);}
.ht{width:100%;border-collapse:collapse;}
.ht th{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);padding:8px 12px;text-align:left;border-bottom:1px solid var(--bd);background:var(--sur2);}
.ht td{font-size:12px;padding:8px 12px;border-bottom:1px solid var(--bd);vertical-align:middle;}
.ht tbody tr:last-child td{border-bottom:none;}
.ht tbody tr:hover td{background:var(--sur2);}
/* SETTINGS */
.sett-card{background:var(--sur);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);}
.sett-title{font-size:13px;font-weight:600;margin-bottom:12px;}
.sett-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(3px);}
.modal-box{background:var(--sur);border-radius:14px;padding:22px;width:100%;max-width:420px;box-shadow:var(--shm);}
.modal-title{font-size:15px;font-weight:700;margin-bottom:14px;}
.modal-row{margin-bottom:10px;}
.modal-lbl{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);display:block;margin-bottom:4px;}
.modal-inp{width:100%;font-family:'Inter',sans-serif;font-size:14px;color:var(--tx);background:var(--sur2);border:1.5px solid var(--bd);border-radius:8px;padding:8px 10px;outline:none;}
.modal-inp:focus{border-color:var(--teal);}
.modal-btns{display:flex;gap:7px;margin-top:14px;}
.modal-btns .btn{flex:1;justify-content:center;text-align:center;padding:9px;}

/* ═══ MOBILE ═══ */
@media (max-width:820px){
  .wrap{padding:14px 12px 50px;}
  .tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{white-space:nowrap;flex:0 0 auto;padding:9px 14px;font-size:12.5px;}
  .rc-grid{grid-template-columns:repeat(2,1fr);gap:8px;}
  .rc{padding:11px 12px;}
  .rc-val{font-size:16px;}
  .inp-grid{grid-template-columns:repeat(2,1fr);gap:8px;}
  .inp{font-size:16px;}
  .charts-grid{grid-template-columns:1fr;}
  .chart-wrap{height:200px;}
  .sett-grid{grid-template-columns:1fr;}
  .wk-hdr{flex-direction:column;align-items:stretch;}
  .sel-wrap{width:100%;}
  .wk-sel{flex:1;font-size:16px;}
  .history-card{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .ht{min-width:600px;}
  .modal-inp{font-size:16px;}
  .modal-box{max-width:100%;}
  .cost-bar-seg{font-size:9px;}
  /* Übersicht-Tab: KPI-Grids und Kostenpills umbrechen */
  .ov-kpis{grid-template-columns:repeat(2,1fr)!important;}
  .ov-pills{grid-template-columns:repeat(3,1fr)!important;}
  .ov-table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .ov-table-scroll table{min-width:620px;}
}
@media (max-width:400px){
  .rc-grid,.inp-grid{grid-template-columns:1fr;}
  .ov-pills{grid-template-columns:repeat(2,1fr)!important;}
}

/* ═══ SOFT-STIL ═══ */
.tabs{background:var(--sur);border:1px solid var(--bd);border-radius:15px;padding:5px;}
.tab{border-radius:11px;}
.tab.on{background:var(--ink);color:#fff;box-shadow:none;}
.tab:not(.on):hover{background:var(--sur2);color:var(--tx);}
.form-card,.chart-card,.history-card,.sett-card,.cost-bar-wrap{border:none;border-radius:22px;box-shadow:var(--sh);}
.modal-box{border-radius:26px;}
.btn-p{background:var(--ink);border-color:var(--ink);}
.btn-p:hover{background:#000;}
.inp:focus,.modal-inp:focus{border-color:var(--ink);background:#fff;}

/* KPI mit Pastell-Schleier - Farbe folgt dem Ergebnis */
.rc{position:relative;overflow:hidden;border:none;border-radius:22px;padding:15px 17px;box-shadow:var(--sh);--blob:#CFCBFF;}
.rc::after{content:'';position:absolute;right:-30px;top:-34px;width:118px;height:118px;border-radius:50%;
  background:var(--blob);filter:blur(28px);opacity:.6;pointer-events:none;}
.rc > *{position:relative;z-index:1;}
.rc.pos{--blob:#79E0AF;}
.rc.neg{--blob:#FF9A88;}
.rc.amber{--blob:#FFD166;}
.rc.pos .rc-val,.rc.neg .rc-val,.rc.amber .rc-val{color:var(--ink);}
#ps-badge{border-radius:20px;}
.inp-ro{display:flex;align-items:center;font-weight:600;color:var(--tx);background:var(--sur2);
  border:1px solid var(--bd);cursor:default;}
.view-ribbon{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:#3F6A9E;background:#E4EDF6;padding:4px 10px;border-radius:20px;}
#gate{position:fixed;inset:0;z-index:99999;background:#EDEDEB;display:flex;align-items:center;justify-content:center;padding:20px;}
#gate .box{background:#fff;border-radius:20px;max-width:380px;width:100%;padding:30px 28px;box-shadow:0 24px 60px rgba(0,0,0,.14);text-align:center;}
#gate img{height:26px;filter:brightness(0);margin-bottom:6px;}
#gate .t{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:10px 0 4px;}
#gate .s{font-size:12.5px;color:#767674;margin-bottom:18px;}
#gate input{width:100%;border:1px solid #E9E9E7;border-radius:11px;padding:12px 14px;font-size:16px;
  font-family:Inter,sans-serif;background:#F5F5F4;outline:none;text-align:center;}
#gate input:focus{border-color:#1A1A19;background:#fff;}
#gate button{width:100%;margin-top:10px;background:#1A1A19;color:#fff;border:none;border-radius:11px;
  padding:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;}
#gate .err{color:#B4544A;font-size:12px;margin-top:10px;min-height:16px;}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <img src="/moov_logo.png" alt="MOOV" onerror="this.style.display='none'">
    <div class="t">P&amp;L Tracker</div>
    <div class="s">Bitte Passwort eingeben, um die Auswertung anzusehen.</div>
    <input id="gate-pw" type="password" placeholder="Passwort" autocomplete="off"
      onkeydown="if(event.key==='Enter')checkGate();">
    <button onclick="checkGate()">Ansehen</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>
<script>
/* ══ Passwort fuer die Ansichts-Seite — HIER aenderbar ══ */
var VIEW_PASSWORD='MOOV-Coaching-2026';
(function(){ if(sessionStorage.getItem('pnl_view_ok')==='1'){var g=document.getElementById('gate');if(g)g.style.display='none';} })();
function checkGate(){
  var v=document.getElementById('gate-pw').value;
  if(v===VIEW_PASSWORD){
    sessionStorage.setItem('pnl_view_ok','1');
    document.getElementById('gate').style.display='none';
  }else{
    document.getElementById('gate-err').textContent='Falsches Passwort.';
    document.getElementById('gate-pw').value='';
  }
}
</script>
<div class="wrap">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
    <div>
      <img src="/moov_logo.png" alt="MOOV" style="height:22px;filter:brightness(0);display:block;margin-bottom:3px;">
      <div style="font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);">P&amp;L Tracker <span class="view-ribbon">Nur Ansicht</span></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" id="tab-week" onclick="showTab('week')">Diese Woche</button>
    <button class="tab" id="tab-overview" onclick="showTab('overview')">&#x1F4CA; Übersicht</button>
    <button class="tab" id="tab-history" onclick="showTab('history')">Verlauf</button>
  </div>

  <!-- WEEK VIEW -->
  <div class="view on" id="view-week">
    <div class="form-card">
      <div class="wk-hdr">
        <div>
          <div class="wk-title" id="week-title">KW —</div>
        </div>
        <div class="sel-wrap">
          <select class="wk-sel" id="week-select" onchange="switchWeek(this.value)"></select>
        </div>
      </div>
      <div class="inp-grid" id="view-grid"></div>
    </div>

    <div class="rc-grid" id="result-cards"></div>

    <div class="cost-bar-wrap" id="cost-bar-wrap">
      <div class="cost-bar-title">Kostenstruktur</div>
      <div class="cost-bar" id="cost-bar"></div>
      <div id="cost-legend"></div>
    </div>

    <div id="vs-avg"></div>

    <div class="charts-grid">
      <div class="chart-card"><div class="chart-title">Umsatz vs. Kosten</div><div class="chart-wrap"><canvas id="chart-umsatz"></canvas></div></div>
      <div class="chart-card"><div class="chart-title">ROAS pro Woche</div><div class="chart-wrap"><canvas id="chart-roas"></canvas></div></div>
    </div>
    <div class="charts-grid" id="extra-charts" style="display:none">
      <div class="chart-card"><div class="chart-title">Nettogewinn pro Woche</div><div class="chart-wrap"><canvas id="chart-gewinn"></canvas></div></div>
      <div class="chart-card"><div class="chart-title">CPA-Verlauf</div><div class="chart-wrap"><canvas id="chart-cpa"></canvas></div></div>
    </div>
    <div class="charts-grid" id="mix-chart" style="display:none">
      <div class="chart-card" style="grid-column:1/-1"><div class="chart-title">Kosten-Mix pro Woche</div><div class="chart-wrap" style="height:220px"><canvas id="chart-mix"></canvas></div></div>
    </div>
  </div>

  <!-- OVERVIEW VIEW -->
  <div class="view" id="view-overview">
    <div id="overview-content"></div>
  </div>

  <!-- HISTORY VIEW -->
  <div class="view" id="view-history">
    <div class="history-card">
      <table class="ht" id="history-table">
        <thead><tr>
          <th>KW</th><th>Umsatz</th><th>Werbung</th><th>ROAS</th><th>Gewinn</th><th>Marge</th><th>CPA</th>
        </tr></thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
  </div>
</div>


<script>
/* ══════════ PORTAL STORE — Supabase Sync ══════════
   Speichert State in Supabase (geräteübergreifend)
   und spiegelt lokal (Offline-Cache + Fallback).      */
var PS = (function(){
  var sb=null, ok=false, timers={}, badgeEl=null;

  function init(){
    if(ok) return true;
    try{
      var u=localStorage.getItem('sb_url'), k=localStorage.getItem('sb_key');
      if(!u||!k||typeof supabase==='undefined') return false;
      sb=supabase.createClient(u,k);
      ok=true;
    }catch(e){ ok=false; }
    return ok;
  }
  function ready(){ return ok; }
  function disable(){ ok=false; }   // Sicherheitsschalter: nie lokal ueber Cloud schreiben

  async function load(key){
    if(!ok) return null;
    var r=await sb.from('portal_state').select('data').eq('key',key).maybeSingle();
    if(r.error) throw r.error;
    return r.data ? r.data.data : null;
  }

  async function saveNow(key,data){
    if(!ok) return;
    var r=await sb.from('portal_state')
      .upsert({key:key,data:data,updated_at:new Date().toISOString()},{onConflict:'key'});
    if(r.error) throw r.error;
    setBadge('ok');
  }

  function save(key,data,delay){
    if(!ok){ setBadge('local'); return; }
    setBadge('pending');
    if(timers[key]) clearTimeout(timers[key]);
    timers[key]=setTimeout(function(){
      saveNow(key,JSON.parse(JSON.stringify(data)))
        .catch(function(e){ console.error('Sync-Fehler:',e.message); setBadge('err',e.message); });
    }, delay||700);
  }

  /* ── Dokumente (eigene Tabelle, eine Zeile pro Datei) ── */
  async function docGet(id){
    if(!ok) return null;
    var r=await sb.from('portal_docs').select('data,mime_type').eq('id',id).maybeSingle();
    if(r.error) throw r.error;
    return r.data ? {data:r.data.data, mimeType:r.data.mime_type} : null;
  }
  async function docPut(id,b64,mime){
    if(!ok) throw new Error('Keine Verbindung');
    var r=await sb.from('portal_docs').upsert({id:id,data:b64,mime_type:mime||'application/pdf'},{onConflict:'id'});
    if(r.error) throw r.error;
  }
  async function docDel(id){
    if(!ok) return;
    var r=await sb.from('portal_docs').delete().eq('id',id);
    if(r.error) throw r.error;
  }

  /* ── Status-Anzeige ── */
  function mountBadge(){
    if(badgeEl) return;
    badgeEl=document.createElement('div');
    badgeEl.id='ps-badge';
    badgeEl.style.cssText='position:fixed;right:12px;bottom:12px;z-index:9000;font-family:Inter,sans-serif;'+
      'font-size:11px;font-weight:500;padding:6px 11px;border-radius:20px;pointer-events:none;'+
      'transition:opacity .3s,background .2s;opacity:0;';
    document.body.appendChild(badgeEl);
    setBadge(ok?'ok':'local');
  }
  function setBadge(kind,msg){
    if(!badgeEl) return;
    var cfg={
      ok:      ['\u2601 Gespeichert','#DFF0E6','#3F7A5A',1200],
      pending: ['\u21BB Speichert\u2026','#F2F2F0','#767674',0],
      local:   ['\u26A0 Nur lokal','#FBF0DC','#9A7B2E',2600],
      err:     ['\u26A0 Sync-Fehler','#FBE3DF','#B4544A',5000]
    }[kind];
    if(!cfg) return;
    badgeEl.textContent=cfg[0]+(kind==='err'&&msg?': '+msg:'');
    badgeEl.style.background=cfg[1];
    badgeEl.style.color=cfg[2];
    badgeEl.style.opacity='1';
    clearTimeout(badgeEl._t);
    if(cfg[3]) badgeEl._t=setTimeout(function(){ badgeEl.style.opacity='0'; }, cfg[3]);
  }

  /* ── Entscheidung bei Erststart / Konflikt ──
     Gibt zurueck: {use:'cloud'|'local', push:bool}
     Niemals automatisch lokale Daten ueber Cloud-Daten schreiben. */
  function decide(remote, local, hasData, label){
    var rHas = !!(remote && hasData(remote));
    var lHas = !!(local  && hasData(local));

    if(rHas && !lHas)  return Promise.resolve({use:'cloud', push:false, sync:true});
    if(!rHas && !lHas) return Promise.resolve({use:'local', push:false, sync:true});  // frisch
    if(rHas && lHas){
      if(JSON.stringify(remote)===JSON.stringify(local))
        return Promise.resolve({use:'cloud', push:false, sync:true});
      return ask(label,
        'Es gibt Daten in der Cloud <b>und</b> abweichende Daten auf diesem Ger\u00e4t.<br>Welche m\u00f6chtest du behalten?',
        [{t:'\u2601 Cloud-Daten verwenden', v:{use:'cloud',push:false,sync:true}, primary:true},
         {t:'\uD83D\uDCBB Ger\u00e4te-Daten hochladen', v:{use:'local',push:true,sync:true}}]);
    }
    // !rHas && lHas -> Erstmigration, aber nur nach Best\u00e4tigung
    return ask(label,
      'Auf diesem Ger\u00e4t liegen Daten, in der Cloud noch keine.<br>Jetzt in die Cloud \u00fcbertragen?',
      [{t:'\u2601 Jetzt \u00fcbertragen', v:{use:'local',push:true,sync:true}, primary:true},
       {t:'Sp\u00e4ter (nur lokal)', v:{use:'local',push:false,sync:false}}]);
  }

  function ask(label, msg, opts){

function psMigrationError(e, bereich){
  console.error('Migration fehlgeschlagen:', e);
  var msg = (e && e.message) ? e.message : String(e);
  var hint = '';
  if(/row-level security|RLS|permission denied/i.test(msg)){
    hint = '\n\nUrsache: Row Level Security blockiert den Zugriff.\n'+
           'Bitte in Supabase im SQL Editor ausf\u00fchren:\n\n'+
           'ALTER TABLE portal_state DISABLE ROW LEVEL SECURITY;\n'+
           'ALTER TABLE portal_docs DISABLE ROW LEVEL SECURITY;';
  } else if(/relation .* does not exist|Could not find the table/i.test(msg)){
    hint = '\n\nUrsache: Die Tabelle portal_state fehlt.\n'+
           'Bitte das CREATE TABLE-SQL in Supabase ausf\u00fchren.';
  }
  alert('\u26A0 '+bereich+': Daten konnten NICHT in die Cloud \u00fcbertragen werden.\n\n'+
        'Fehler: '+msg+hint+
        '\n\nDeine lokalen Daten sind unver\u00e4ndert. Es geht nichts verloren.');
}


function psLoadWarn(e, bereich){

function cf(n){return 'CHF '+(parseFloat(n)||0).toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});}
function pf(n){return(parseFloat(n)||0).toFixed(1)+'%';}
function rf(n){return(parseFloat(n)||0).toFixed(2)+'x';}

function calc(w,s){
  var u=parseFloat(w.umsatz)||0,b=parseFloat(w.bestellungen)||0,a=parseFloat(w.artikel)||0;
  var m=parseFloat(w.meta)||0,r=parseFloat(w.retouren)||0,ex=parseFloat(w.extra)||0;
  var g=parseFloat(w.google)||0, tt=parseFloat(w.tiktok)||0, inf=parseFloat(w.influencer)||0;
  var ads=m+g+tt+inf, mkt=ads;
  var cogs=a*(parseFloat(s.cogs_per_unit)||6);
  var svz=b*(parseFloat(s.svz_per_order)||10.99);
  var fee=u*(parseFloat(s.payment_fee_pct)||2.8)/100;
  var cow=parseFloat(s.coworking_weekly)||64.62;
  var sh=parseFloat(s.shopify_weekly)||32.31;
  var fix=cow+sh;
  var total_costs=cogs+svz+fee+fix+mkt+r+ex;
  var gewinn=u-total_costs;
  var marge=u>0?gewinn/u*100:0;
  var roas=ads>0?u/ads:0;
  var roas_meta=m>0?u/m:0, roas_mkt=mkt>0?u/mkt:0;
  var cpa=b>0?ads/b:0;
  return{u:u,b:b,a:a,m:m,g:g,tt:tt,inf:inf,ads:ads,mkt:mkt,r:r,ex:ex,
    cogs:cogs,svz:svz,fee:fee,cow:cow,sh:sh,fix:fix,
    total_costs:total_costs,gewinn:gewinn,marge:marge,roas:roas,roas_meta:roas_meta,roas_mkt:roas_mkt,cpa:cpa};
}

  });
  function sumW(weeks){
    var u=0,m=0,cg=0,sv=0,fe=0,fi=0,gew=0,best=0;
    weeks.forEach(function(w){var c=calc(w,state.settings);u+=c.u;m+=c.ads;cg+=c.cogs;sv+=c.svz;fe+=c.fee;fi+=c.cow+c.sh;gew+=c.gewinn;best+=c.b;});
    return{u:u,m:m,cogs:cg,svz:sv,fee:fe,fix:fi,gew:gew,best:best,roas:m>0?u/m:0,marge:u>0?gew/u*100:0,cpa:best>0?m/best:0};
  }
  var curYear=new Date().getFullYear();
  var withData=sorted.filter(function(w){return(parseFloat(w.umsatz)||0)>0;});
  var yearW=withData.filter(function(w){return parseInt(w.year)===curYear;});
  var last4=withData.slice(-4);
  var sYear=sumW(yearW.length?yearW:withData);
  var s4=sumW(last4);
  function kpi(lbl,val,sub,col){
    return '<div style="background:var(--sur);border:1px solid var(--bd);border-radius:10px;padding:13px 15px;">'+
      '<div style="font-family:DM Mono,monospace;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);margin-bottom:5px;">'+lbl+'</div>'+
      '<div style="font-size:18px;font-weight:700;letter-spacing:-.02em;color:'+(col||'var(--tx)')+'">'+val+'</div>'+
      (sub?'<div style="font-size:11px;color:var(--tx3);margin-top:2px;">'+sub+'</div>':'')+
    '</div>';
  }
  function pill(lbl,val,pct){
    return '<div style="background:var(--sur2);border-radius:8px;padding:8px 10px;text-align:center;">'+
      '<div style="font-size:10px;color:var(--tx3);">'+lbl+'</div>'+
      '<div style="font-size:13px;font-weight:600;color:var(--tx);">'+cf(val)+'</div>'+
      '<div style="font-size:10px;color:var(--tx3);">'+pct.toFixed(1)+'%</div>'+
    '</div>';
  }
  function section(title,sub,s,nw,type){
    var pc=function(v){return s.u>0?v/s.u*100:0;};
    var umsatzSub=type==='year'?(nw>0?'Ø '+cf(s.u/nw)+'/Woche':nw+' Wochen'):nw+' Wochen';
    return '<div style="background:var(--sur);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);">'+
      '<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap;">'+
        '<div style="font-size:15px;font-weight:700;color:var(--tx);">'+title+'</div>'+
        '<div style="font-size:12px;color:var(--tx3);">'+sub+'</div>'+
      '</div>'+
      '<div class="ov-kpis" style="display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px;">'+
        kpi('Umsatz',cf(s.u),umsatzSub)+
        kpi(s.gew>=0?'Gewinn':'Verlust',cf(s.gew),pf(s.marge)+' Nettomarge',s.gew>=0?'var(--green)':'var(--red)')+
        kpi('ROAS',rf(s.roas),cf(s.m)+' Werbung gesamt',s.roas>=2?'var(--green)':s.roas>=1?'var(--amber)':'var(--red)')+
        kpi('CPA',cf(s.cpa),s.best+' Bestellungen')+
      '</div>'+
      '<div style="font-family:DM Mono,monospace;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);margin-bottom:7px;">Kostenstruktur</div>'+
      '<div class="ov-pills" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;">'+
        pill('COGS',s.cogs,pc(s.cogs))+pill('SVZ',s.svz,pc(s.svz))+pill('Meta',s.m,pc(s.m))+
        pill('Fees',s.fee,pc(s.fee))+pill('Fix',s.fix,pc(s.fix))+
      '</div>'+
    '</div>';
  }
  function weekTable(){
    if(!withData.length)return'';
    var rows=withData.map(function(w){
      var c=calc(w,state.settings);
      return'<tr style="border-bottom:1px solid var(--bd);">'+
        '<td style="padding:8px 12px;font-weight:500;font-size:12px;">'+w.kw+' / '+w.year+'</td>'+
        '<td style="padding:8px 12px;font-size:12px;">'+cf(c.u)+'</td>'+
        '<td style="padding:8px 12px;font-size:12px;color:'+(c.gewinn>=0?'var(--green)':'var(--red)')+'">'+cf(c.gewinn)+'</td>'+
        '<td style="padding:8px 12px;font-size:12px;">'+pf(c.marge)+'</td>'+
        '<td style="padding:8px 12px;font-size:12px;color:'+(c.roas>=2?'var(--green)':c.roas>=1?'var(--amber)':'var(--red)')+'">'+rf(c.roas)+'</td>'+
        '<td style="padding:8px 12px;font-size:12px;">'+cf(c.ads)+'</td>'+
        '<td style="padding:8px 12px;font-size:12px;">'+cf(c.cpa)+'</td>'+
      '</tr>';
    }).join('');
    var ths=['KW','Umsatz','Gewinn','Marge','ROAS','Werbung','CPA'].map(function(h){
      return'<th style="padding:8px 12px;text-align:left;font-family:DM Mono,monospace;font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;font-weight:500;border-bottom:1px solid var(--bd);">'+h+'</th>';
    }).join('');
    return'<div style="background:var(--sur);border:1px solid var(--bd);border-radius:14px;overflow:hidden;box-shadow:var(--sh);">'+
      '<div style="padding:13px 16px;border-bottom:1px solid var(--bd);font-size:13px;font-weight:600;color:var(--tx);">Alle Wochen</div>'+
      '<div class="ov-table-scroll" style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;">'+
        '<thead><tr style="background:var(--sur2);">'+ths+'</tr></thead>'+
        '<tbody>'+rows+'</tbody>'+
      '</table></div>'+
    '</div>';
  }
  var nYear=yearW.length||withData.length;
  var allN=withData.length;
  document.getElementById('overview-content').innerHTML=
    section('Jahr '+curYear,'alle Wochen kumuliert',sYear,nYear,'year')+
    section('Letzte 4 Wochen',last4.length===allN?'alle Wochen':last4.map(function(w){return w.kw;}).join(', '),s4,last4.length,'last4')+
    weekTable();
}

// HISTORY TAB
function renderHistory(){
  var tbody=document.getElementById('history-body');if(!tbody)return;
  var nonRef=state.weeks.filter(function(w){return !w.isRef&&(parseFloat(w.umsatz)||0)>0;});
  nonRef=nonRef.slice().sort(function(a,b){
    var ay=parseInt(a.year)||2026,by=parseInt(b.year)||2026;
    var akw=parseInt(String(a.kw).replace(/[^0-9]/g,''))||0,bkw=parseInt(String(b.kw).replace(/[^0-9]/g,''))||0;
    return ay!==by?ay-by:akw-bkw;
  });
  tbody.innerHTML=nonRef.map(function(w){
    var c=calc(w,state.settings);
    return'<tr><td>'+w.kw+' / '+w.year+'</td><td>'+cf(c.u)+'</td><td>'+cf(c.ads)+'</td>'+
      '<td style="color:'+(c.roas>=2?'var(--green)':c.roas>=1?'var(--amber)':'var(--red)')+'">'+rf(c.roas)+'</td>'+
      '<td style="color:'+(c.gewinn>=0?'var(--green)':'var(--red)')+'">'+cf(c.gewinn)+'</td>'+
      '<td>'+pf(c.marge)+'</td><td>'+cf(c.cpa)+'</td></tr>';
  }).join('');
}
