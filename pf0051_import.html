<script>

tten":10,"rechnungNr":"PF0051.05","spediteur":"Streck","flavors":[{"name":"Zitrone","qty":1980},{"name":"Orange","qty":1960},{"name":"Waldbeere","qty":2450},{"name":"Mango","qty":1470},{"name":"Pfirsich","qty":980},{"name":"Limited Edition 2","qty":980}],"attachments":[],"payments":[{"id":"nb1c889b2c4f14fa2","ref":"Anzahlung 50%","refNr":"PF0051.05 Anzahlung","amount":13919.85,"amount_paid":0,"dueDate":"2027-02-18","paidDate":"","notes":"6 Wochen vor Ankunft"},{"id":"n00c711fb565ce8a1","ref":"Restbetrag 50%","refNr":"PF0051.05 Restbetrag","amount":13919.85,"amount_paid":0,"dueDate":"2027-04-01","paidDate":"","notes":"bei Lieferung"}]}]};
var KEY='moov_lieferungen';
var sb=null, current=null;
function log(m,c){var e=document.getElementById('log');e.innerHTML+='\n'+(c?'<span class="'+c+'">'+m+'</span>':m);e.scrollTop=e.scrollHeight;}

(function preview(){
  var p=document.getElementById('preview');
  var allp=NEW.payments.slice();NEW.deliveries.forEach(function(d){allp=allp.concat(d.payments);});
  var soll=allp.reduce(function(s,x){return s+x.amount;},0);
  p.innerHTML='<div class="row"><span>Bestellung</span><b>'+NEW.ref+'</b></div>'+
    '<div class="row"><span>Menge</span><b>'+NEW.totalUnits.toLocaleString('de-CH')+' Boxen</b></div>'+
    '<div class="row"><span>Teillieferungen</span><b>'+NEW.deliveries.length+'</b></div>'+
    '<div class="row"><span>Zahlungstermine</span><b>'+allp.length+'</b></div>'+
    '<div class="row"><span>Auftragswert</span><b>EUR '+soll.toLocaleString('de-CH',{minimumFractionDigits:2})+'</b></div>';
})();

function initSb(){
  var url=localStorage.getItem('sb_url'), key=localStorage.getItem('sb_key');
  if(!url||!key){log('Keine Supabase-Zugangsdaten gefunden. Bitte zuerst im Portal einloggen.','err');return false;}
  sb=supabase.createClient(url,key);return true;
}
async function load(){
  if(!initSb())return;
  try{
    var r=await sb.from('portal_state').select('data').eq('key',KEY).maybeSingle();
    if(r.error)throw r.error;
    current=r.data&&r.data.data?r.data.data:{orders:[]};
    if(typeof current==='string')current=JSON.parse(current);
    log('Aktueller Stand geladen: '+(current.orders?current.orders.length:0)+' Bestellungen.','ok');
    var exists=(current.orders||[]).some(function(o){return o.ref==='PF0051';});
    if(exists)log('⚠ PF0051 ist bereits vorhanden — der Import würde sie NICHT doppelt anlegen, sondern abbrechen.','warn');
    document.getElementById('impBtn').disabled=false;
  }catch(e){log('Fehler beim Laden: '+e.message,'err');}
}
function backup(){
  if(!current){log('Erst laden.','err');return;}
  var blob=new Blob([JSON.stringify(current,null,1)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='moov_lieferungen_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  log('Backup heruntergeladen.','ok');
}
async function doImport(){
  if(!current){log('Erst laden.','err');return;}
  if((current.orders||[]).some(function(o){return o.ref==='PF0051';})){
    log('PF0051 existiert bereits — Import abgebrochen (keine Dopplung).','warn');return;}
  document.getElementById('impBtn').disabled=true;
  try{
    // Backup in Supabase
    await sb.from('portal_state').upsert({key:'moov_lieferungen_backup',data:current});
    log('Sicherung in Supabase abgelegt (Key moov_lieferungen_backup).','ok');
    if(!Array.isArray(current.orders))current.orders=[];
    current.orders.push(NEW);
    var w=await sb.from('portal_state').upsert({key:KEY,data:current});
    if(w.error)throw w.error;
    log('✓ PF0051 hinzugefügt. Jetzt '+current.orders.length+' Bestellungen.','ok');
    log('Fertig! Portal neu laden (Cmd+Shift+R). Diese Seite kannst du danach löschen.','ok');
  }catch(e){log('Fehler: '+e.message,'err');document.getElementById('impBtn').disabled=false;}
}
load();
</script></body></html>
