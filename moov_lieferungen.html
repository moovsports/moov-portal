<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>MOOV · Lieferungen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --canvas:#EDEDEB;--ink:#1A1A19;
  --sur:#FFFFFF;--sur2:#F5F5F4;--bd:#E9E9E7;--bds:#D8D8D6;
  --tx:#1A1A19;--tx2:#767674;--tx3:#A3A3A1;
  --green:#3F7A5A;--gsoft:#E4F0E9;
  --red:#B4544A;--rsoft:#FBE7E3;
  --amber:#9A7B2E;--asoft:#FBF0DC;
  --blue:#3F6A9E;--bsoft:#E4EDF6;
  --sh:0 1px 2px rgba(0,0,0,.04);
  --shm:0 12px 40px rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--canvas);color:var(--tx);
  -webkit-font-smoothing:antialiased;line-height:1.5;font-size:14px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px);}
.wrap{max-width:1320px;margin:0 auto;padding:18px 16px;}
.mono{font-family:'DM Mono',monospace;}

.top{display:flex;align-items:center;gap:11px;margin-bottom:14px;flex-wrap:wrap;}
.top .logo{height:19px;}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.02em;}
.top .date{font-family:'DM Mono',monospace;font-size:11px;color:var(--tx3);}
.top .sp{margin-left:auto;}
.btn{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:550;padding:8px 15px;
  border-radius:10px;border:1px solid var(--bd);background:var(--sur);color:var(--tx2);
  cursor:pointer;transition:all .13s;white-space:nowrap;}
.btn:hover{border-color:var(--bds);color:var(--tx);}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff;}
.btn.dark:hover{background:#000;}
.btn.sm{font-size:11.5px;padding:6px 12px;}
.btn.xs{font-size:11px;padding:5px 10px;}
.btn.danger:hover{background:var(--rsoft);color:var(--red);border-color:var(--red);}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px;}
.k{background:var(--sur);border-radius:14px;box-shadow:var(--sh);padding:14px 16px;
  border-left:3px solid var(--bds);}
.k.alert{border-left-color:var(--red);} .k.warn{border-left-color:var(--amber);}
.k.ok{border-left-color:var(--green);}
.k .kl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--tx3);margin-bottom:6px;}
.k .kv{font-size:20px;font-weight:700;letter-spacing:-.025em;}
.k.alert .kv{color:var(--red);}
.k .ks{font-size:11.5px;color:var(--tx2);margin-top:2px;}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;}
.panel{background:var(--sur);border-radius:14px;box-shadow:var(--sh);overflow:hidden;
  display:flex;flex-direction:column;}
.s4{grid-column:span 4;} .s5{grid-column:span 5;} .s7{grid-column:span 7;}
.s8{grid-column:span 8;} .s12{grid-column:span 12;}
.ph{display:flex;align-items:center;gap:9px;padding:13px 16px 11px;
  border-bottom:1px solid var(--bd);flex-shrink:0;}
.ph h2{font-size:13px;font-weight:650;letter-spacing:-.01em;}
.ph .cnt{font-family:'DM Mono',monospace;font-size:10px;color:var(--tx3);
  background:var(--sur2);padding:2px 7px;border-radius:20px;}
.ph .act{margin-left:auto;font-size:11.5px;color:var(--tx3);cursor:pointer;
  background:none;border:none;font-family:'Inter',sans-serif;}
.ph .act:hover{color:var(--tx);}
.pbody{overflow-y:auto;flex:1;}
.empty{padding:26px 16px;text-align:center;color:var(--tx3);font-size:12.5px;}

/* ── Bestellungs-Liste (Master) ── */
.ord{display:grid;grid-template-columns:16px 1fr auto;gap:9px;align-items:center;
  padding:11px 16px;border-bottom:1px solid var(--bd);cursor:pointer;
  border-left:3px solid transparent;}
.ord:last-child{border-bottom:none;}
.ord:hover{background:var(--sur2);}
.ord.sel{background:var(--sur2);border-left-color:var(--ink);}
.ord.dragging{opacity:.35;}
.ord.over{box-shadow:inset 0 2px 0 var(--ink);}
.grip{color:var(--bds);font-size:12px;cursor:grab;user-select:none;line-height:1;}
.grip:hover{color:var(--tx3);}
.ord .n{font-size:13px;font-weight:600;margin-bottom:2px;display:flex;
  align-items:center;gap:7px;flex-wrap:wrap;}
.ord .meta{font-size:11px;color:var(--tx3);}
.ord .r{text-align:right;white-space:nowrap;}
.ord .tot{font-family:'DM Mono',monospace;font-size:12.5px;font-weight:550;}
.pbar{height:3px;background:var(--sur2);border-radius:20px;margin-top:5px;overflow:hidden;}
.pbar i{display:block;height:100%;}

.tag{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 7px;border-radius:20px;white-space:nowrap;}
.tg-ok{background:var(--gsoft);color:var(--green);}
.tg-late{background:var(--rsoft);color:var(--red);}
.tg-open{background:var(--asoft);color:var(--amber);}
.tg-info{background:var(--bsoft);color:var(--blue);}
.tg-grey{background:var(--sur2);color:var(--tx3);}

/* ── DETAIL: Teillieferungs-Karten ── */
.dt-head{padding:14px 16px;border-bottom:1px solid var(--bd);background:var(--sur2);}
.dt-title{font-size:16px;font-weight:700;letter-spacing:-.02em;display:flex;
  align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px;}
.dt-sub{font-size:11.5px;color:var(--tx2);}
.dt-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px;}
.dt-stat{background:var(--sur);border-radius:10px;padding:8px 10px;}
.dt-stat .l{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--tx3);}
.dt-stat .v{font-family:'DM Mono',monospace;font-size:12.5px;font-weight:600;margin-top:2px;}
.dt-stat .v.g{color:var(--green);} .dt-stat .v.r{color:var(--red);}

.dcard{border:1px solid var(--bd);border-radius:13px;margin:9px 12px;overflow:hidden;
  border-left:3px solid var(--bds);}
.dcard.paid{border-left-color:var(--green);}
.dcard.part{border-left-color:var(--amber);}
.dcard.late{border-left-color:var(--red);}
.dcard.anz{border-left-color:var(--blue);}
.dc-head{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;
  padding:11px 13px;cursor:pointer;}
.dc-head:hover{background:var(--sur2);}
.dc-n{font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.dc-m{font-size:11px;color:var(--tx3);margin-top:2px;}
.dc-a{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;white-space:nowrap;}
.dc-x{width:22px;height:22px;border-radius:6px;border:1px solid var(--bd);background:var(--sur);
  font-size:9px;color:var(--tx3);cursor:pointer;flex-shrink:0;}
.dc-body{display:none;border-top:1px solid var(--bd);padding:12px 13px;background:var(--sur2);}
.dcard.open .dc-body{display:block;}

.we{background:var(--sur);border-radius:10px;padding:11px 12px;margin-bottom:10px;
  display:grid;grid-template-columns:1fr auto;gap:11px;align-items:center;}
.we-l{font-size:11.5px;font-weight:600;margin-bottom:5px;}
.we-bar{height:5px;background:var(--sur2);border-radius:20px;overflow:hidden;}
.we-bar i{display:block;height:100%;background:var(--green);border-radius:20px;}
.we-s{font-size:10.5px;color:var(--tx3);margin-top:4px;}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.chip{background:var(--sur);border:1px solid var(--bd);border-radius:9px;padding:6px 11px;
  font-size:11.5px;}
.chip b{font-family:'DM Mono',monospace;font-weight:600;}
.fpill{display:inline-block;font-size:10.5px;padding:3px 9px;border-radius:20px;
  margin:0 4px 4px 0;font-weight:500;}
.f-Zitrone{background:#F7E9C4;color:#6B5316;} .f-Orange{background:#F7D9C4;color:#7A4A24;}
.f-Waldbeere{background:#E2D8EE;color:#4A3363;} .f-Limited{background:#D4E4F2;color:#234863;}
.f-x{background:#E4E4E2;color:#5A5A58;}

.sect{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tx3);margin:12px 0 6px;display:flex;
  align-items:center;gap:7px;}
.sect .r{margin-left:auto;}

.ptab{background:var(--sur);border-radius:10px;overflow:hidden;}
.ptr{display:grid;grid-template-columns:1fr 76px 84px 26px;gap:8px;align-items:center;
  padding:8px 11px;border-bottom:1px solid var(--bd);font-size:12px;}
.ptr:last-child{border-bottom:none;}
.ptr:hover{background:var(--sur2);}
.ptr.late{background:var(--rsoft);}
.ptr .pd{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--tx3);}
.ptr .pa{font-family:'DM Mono',monospace;font-size:12px;font-weight:550;text-align:right;}
.ptr.paid .pa{color:var(--green);}
.ptr.late .pa{color:var(--red);}

.docs{display:flex;flex-direction:column;gap:5px;}
.drow{display:grid;grid-template-columns:20px 1fr auto;gap:9px;align-items:center;
  background:var(--sur);border-radius:9px;padding:8px 11px;font-size:12px;}
.drow.miss{background:var(--rsoft);}
.drow.opt{opacity:.62;}
.dst{width:17px;height:17px;border-radius:5px;display:flex;align-items:center;
  justify-content:center;font-size:9.5px;font-weight:700;flex-shrink:0;}
.dst.y{background:var(--green);color:#fff;}
.dst.n{background:var(--red);color:#fff;}
.dst.o{background:var(--bd);color:var(--tx3);}
.dl-n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dl-s{font-size:10.5px;color:var(--tx3);}
.drow.miss .dl-s{color:var(--red);}
.ib{width:26px;height:26px;border-radius:7px;border:1px solid var(--bd);background:var(--sur);
  cursor:pointer;font-size:11px;color:var(--tx2);flex-shrink:0;}
.ib:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
.ib.del:hover{background:var(--rsoft);color:var(--red);border-color:var(--red);}
.dacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;padding-top:10px;
  border-top:1px solid var(--bd);}

/* ── Zahlungsplan ── */
.zp{padding:12px 14px;}
.zp-o{margin-bottom:13px;}
.zp-o:last-child{margin-bottom:0;}
.zp-h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
.zp-h .n{font-size:12.5px;font-weight:650;}
.zp-h .a{margin-left:auto;font-family:'DM Mono',monospace;font-size:12px;font-weight:600;}
.zp-r{display:grid;grid-template-columns:60px 1fr auto;gap:8px;font-size:11.5px;
  padding:4px 0;align-items:center;}
.zp-r .d{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--tx3);}
.zp-r .m{font-family:'DM Mono',monospace;font-size:11.5px;text-align:right;}
.zp-r.late .d,.zp-r.late .m{color:var(--red);font-weight:600;}
.zp-r.done{opacity:.45;}
.zp-r.done .m{color:var(--green);}
.zp-bar{height:4px;background:var(--sur2);border-radius:20px;overflow:hidden;margin:5px 0 7px;}
.zp-bar i{display:block;height:100%;}

/* ── Tasks / Cash / Docs / Plan ── */
.task{display:grid;grid-template-columns:52px 1fr auto auto;gap:10px;align-items:center;
  padding:10px 16px;border-bottom:1px solid var(--bd);}
.task:last-child{border-bottom:none;}
.task:hover{background:var(--sur2);}
.task.late{background:var(--rsoft);}
.task .d{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--tx2);}
.task.late .d{color:var(--red);font-weight:600;}
.task .t{font-size:13px;font-weight:500;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.task .sub{font-size:11px;color:var(--tx3);}
.task .amt{font-family:'DM Mono',monospace;font-size:13px;font-weight:550;white-space:nowrap;}
.task.late .amt{color:var(--red);}

.cf{padding:14px 16px;}
.cfrow{display:grid;grid-template-columns:46px 1fr 86px;gap:10px;align-items:center;margin-bottom:7px;}
.cfrow:last-child{margin-bottom:0;}
.cfm{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--tx3);text-transform:uppercase;}
.cftrack{height:20px;background:var(--sur2);border-radius:5px;overflow:hidden;}
.cftrack i{display:block;height:100%;background:var(--ink);border-radius:5px;min-width:2px;}
.cftrack i.hot{background:var(--red);}
.cfv{font-family:'DM Mono',monospace;font-size:11.5px;text-align:right;color:var(--tx2);}

.doc{padding:11px 16px;border-bottom:1px solid var(--bd);}
.doc:last-child{border-bottom:none;}
.doch{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.doch .nm{font-size:12.5px;font-weight:600;}
.doch .ct{margin-left:auto;font-family:'DM Mono',monospace;font-size:10.5px;color:var(--tx3);}
.dbar{height:4px;background:var(--sur2);border-radius:20px;overflow:hidden;margin-bottom:8px;}
.dbar i{display:block;height:100%;background:var(--green);}
.dmiss{display:flex;flex-wrap:wrap;gap:5px;}
.dchip{font-size:10.5px;padding:3px 9px;border-radius:20px;background:var(--rsoft);
  color:var(--red);cursor:pointer;border:1px solid transparent;}
.dchip:hover{border-color:var(--red);}
.dchip.ok{background:var(--gsoft);color:var(--green);cursor:default;}

.dl{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;
  padding:10px 16px;border-bottom:1px solid var(--bd);}
.dl:last-child{border-bottom:none;}
.dl .d{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--tx2);}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--sur2);}
.stack span{display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:600;overflow:hidden;white-space:nowrap;}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;
  align-items:center;justify-content:center;padding:18px;z-index:200;}
.ov.on{display:flex;}
.mbox{background:var(--sur);border-radius:20px;width:100%;max-width:640px;
  max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shm);}
.mh{display:flex;align-items:center;gap:10px;padding:17px 20px 14px;
  border-bottom:1px solid var(--bd);flex-shrink:0;}
.mh h3{font-size:16px;font-weight:650;letter-spacing:-.02em;}
.mx{margin-left:auto;width:30px;height:30px;border-radius:9px;border:1px solid var(--bd);
  background:var(--sur);cursor:pointer;color:var(--tx2);font-size:14px;flex-shrink:0;}
.mx:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
.mb{padding:18px 20px;overflow-y:auto;flex:1;}
.mf{padding:13px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;
  justify-content:flex-end;flex-shrink:0;flex-wrap:wrap;}
.lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tx3);margin:15px 0 6px;}
.lbl:first-child{margin-top:0;}
.fld{width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px 13px;
  font-size:15px;font-family:'Inter',sans-serif;background:var(--sur2);outline:none;color:var(--tx);}
.fld:focus{border-color:var(--ink);background:var(--sur);}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.hintbox{background:var(--bsoft);border-radius:11px;padding:11px 13px;
  font-size:12px;color:#2C4A6E;line-height:1.55;margin-bottom:14px;}
.hintbox b{font-weight:650;}
.row{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;
  padding:9px 12px;background:var(--sur2);border-radius:10px;margin-bottom:6px;font-size:12.5px;}
.row .rt{font-weight:500;overflow:hidden;text-overflow:ellipsis;}
.row .rs{font-size:11px;color:var(--tx3);}
.row .ra{font-family:'DM Mono',monospace;font-size:12px;white-space:nowrap;}
.row.miss{background:var(--rsoft);color:var(--red);}
.row.have{background:var(--gsoft);}
.dropz{border:1.5px dashed var(--bds);border-radius:12px;padding:18px;text-align:center;
  color:var(--tx3);font-size:12.5px;cursor:pointer;}
.dropz:hover{border-color:var(--ink);color:var(--tx2);}
.plan{background:var(--sur2);border-radius:12px;padding:12px;max-height:220px;overflow-y:auto;}
.planrow{display:grid;grid-template-columns:82px 1fr auto;gap:9px;font-size:12px;
  padding:5px 0;border-bottom:1px solid var(--bd);}
.planrow:last-child{border-bottom:none;}
.planrow .pd{font-family:'DM Mono',monospace;font-size:11px;color:var(--tx3);}
.planrow .pa{font-family:'DM Mono',monospace;font-weight:550;text-align:right;}

#ps-badge{border-radius:20px;}

@media(max-width:1080px){
  .s4,.s5,.s7,.s8{grid-column:span 12;}
  .kpis{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:640px){
  .wrap{padding:12px 11px;}
  .kpis{grid-template-columns:1fr;}
  .dt-stats{grid-template-columns:repeat(2,1fr);}
  .task{grid-template-columns:46px 1fr auto;gap:8px;}
  .task .btn{grid-column:2/-1;justify-self:start;margin-top:4px;}
  .frow,.frow3{grid-template-columns:1fr;}
  .fld{font-size:16px;}
  .mbox{max-height:94vh;border-radius:18px;}
  .ptr{grid-template-columns:1fr 70px 22px;}
  .ptr .pd{grid-column:1/-1;}
  .dcard{margin:8px;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img class="logo" src="/moov_logo.png" alt="MOOV" onerror="this.style.display='none'">
    <h1>Lieferungen</h1>
    <span class="date" id="today"></span>
    <span class="sp"></span>
    <select class="btn" id="sortSel" onchange="setSort(this.value)" style="padding:7px 10px">
      <option value="manual">Eigene Reihenfolge</option>
      <option value="ref">Bestellnummer</option>
      <option value="due">Nächste Fälligkeit</option>
      <option value="open">Offener Betrag</option>
    </select>
    <button class="btn dark" onclick="openNew()">+ Bestellung</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <section class="panel s8">
      <div class="ph"><h2 id="dtHead">Bestellung</h2><span class="cnt" id="dtCnt"></span>
        <button class="act" onclick="toggleAllCards()" id="dtToggle">alle aufklappen</button></div>
      <div class="pbody" id="detail" style="max-height:620px"></div>
    </section>

    <section class="panel s4">
      <div class="ph"><h2>Bestellungen</h2><span class="cnt" id="ordCnt">0</span>
        <button class="act" onclick="openNew()">+ neu</button></div>
      <div class="pbody" id="orders" style="max-height:250px"></div>
      <div class="ph" style="border-top:1px solid var(--bd)"><h2>Was noch zu überweisen ist</h2></div>
      <div class="pbody zp" id="zplan" style="max-height:352px"></div>
    </section>

    <section class="panel s12">
      <div class="ph"><h2>Zu erledigen</h2><span class="cnt" id="taskCnt">0</span>
        <button class="act" onclick="toggleAllTasks()" id="taskToggle">alle zeigen</button></div>
      <div class="pbody" id="tasks" style="max-height:300px"></div>
    </section>

    <section class="panel s7">
      <div class="ph"><h2>Was rausgeht</h2><span class="cnt">offene Zahlungen</span></div>
      <div class="cf" id="cash"></div>
    </section>

    <section class="panel s5">
      <div class="ph"><h2>Dokumente</h2><span class="cnt" id="docCnt"></span></div>
      <div class="pbody" id="docs" style="max-height:300px"></div>
    </section>

    <section class="panel s12">
      <div class="ph"><h2>Lieferplan</h2><span class="cnt">kommende Lieferungen</span></div>
      <div class="pbody" id="plan"></div>
    </section>
  </div>
</div>

<div class="ov" id="ovOrd" onclick="bgClose(event,this)">
  <div class="mbox"><div class="mh"><h3 id="ordTitle">Bestellung</h3>
    <button class="mx" onclick="closeOv('ovOrd')">&#x2715;</button></div>
    <div class="mb" id="ordBody"></div>
    <div class="mf"><button class="btn danger" onclick="delOrder()">Löschen</button>
      <span style="flex:1"></span>
      <button class="btn" onclick="closeOv('ovOrd')">Abbrechen</button>
      <button class="btn dark" onclick="saveOrder()">Speichern</button></div>
  </div>
</div>
<div class="ov" id="ovNew" onclick="bgClose(event,this)">

<script>
/* ══════════ PORTAL STORE — Supabase Sync ══════════
   Speichert State in Supabase (geräteübergreifend)
   und spiegelt lokal (Offline-Cache + Fallback).      */
var PS = (function(){
  var sb=null, ok=false, timers={}, badgeEl=null;

  function init(){
    if(ok) return true;
    try{
      var u=localStorage.getItem('sb_url'), k=localStorage.getItem('sb_key');
      if(!u||!k||typeof supabase==='undefined') return false;
      sb=supabase.createClient(u,k);
      ok=true;
    }catch(e){ ok=false; }
    return ok;
  }
  function ready(){ return ok; }
  function disable(){ ok=false; }   // Sicherheitsschalter: nie lokal ueber Cloud schreiben

  async function load(key){
    if(!ok) return null;
    var r=await sb.from('portal_state').select('data').eq('key',key).maybeSingle();
    if(r.error) throw r.error;
    return r.data ? r.data.data : null;
  }

  async function saveNow(key,data){
    if(!ok) return;
    var r=await sb.from('portal_state')
      .upsert({key:key,data:data,updated_at:new Date().toISOString()},{onConflict:'key'});
    if(r.error) throw r.error;
    setBadge('ok');
  }

  function save(key,data,delay){
    if(!ok){ setBadge('local'); return; }
    setBadge('pending');
    if(timers[key]) clearTimeout(timers[key]);
    timers[key]=setTimeout(function(){
      saveNow(key,JSON.parse(JSON.stringify(data)))
        .catch(function(e){ console.error('Sync-Fehler:',e.message); setBadge('err',e.message); });
    }, delay||700);
  }

  /* ── Dokumente (eigene Tabelle, eine Zeile pro Datei) ── */
  async function docGet(id){
    if(!ok) return null;
    var r=await sb.from('portal_docs').select('data,mime_type').eq('id',id).maybeSingle();
    if(r.error) throw r.error;
    return r.data ? {data:r.data.data, mimeType:r.data.mime_type} : null;
  }
  async function docPut(id,b64,mime){
    if(!ok) throw new Error('Keine Verbindung');
    var r=await sb.from('portal_docs').upsert({id:id,data:b64,mime_type:mime||'application/pdf'},{onConflict:'id'});
    if(r.error) throw r.error;
  }
  async function docDel(id){
    if(!ok) return;
    var r=await sb.from('portal_docs').delete().eq('id',id);
    if(r.error) throw r.error;
  }

  /* ── Status-Anzeige ── */
  function mountBadge(){
    if(badgeEl) return;
    badgeEl=document.createElement('div');
    badgeEl.id='ps-badge';
    badgeEl.style.cssText='position:fixed;right:12px;bottom:12px;z-index:9000;font-family:Inter,sans-serif;'+
      'font-size:11px;font-weight:500;padding:6px 11px;border-radius:20px;pointer-events:none;'+
      'transition:opacity .3s,background .2s;opacity:0;';
    document.body.appendChild(badgeEl);
    setBadge(ok?'ok':'local');
  }
  function setBadge(kind,msg){
    if(!badgeEl) return;
    var cfg={
      ok:      ['\u2601 Gespeichert','#DFF0E6','#3F7A5A',1200],
      pending: ['\u21BB Speichert\u2026','#F2F2F0','#767674',0],
      local:   ['\u26A0 Nur lokal','#FBF0DC','#9A7B2E',2600],
      err:     ['\u26A0 Sync-Fehler','#FBE3DF','#B4544A',5000]
    }[kind];
    if(!cfg) return;
    badgeEl.textContent=cfg[0]+(kind==='err'&&msg?': '+msg:'');
    badgeEl.style.background=cfg[1];
    badgeEl.style.color=cfg[2];
    badgeEl.style.opacity='1';
    clearTimeout(badgeEl._t);
    if(cfg[3]) badgeEl._t=setTimeout(function(){ badgeEl.style.opacity='0'; }, cfg[3]);
  }

  /* ── Entscheidung bei Erststart / Konflikt ──
     Gibt zurueck: {use:'cloud'|'local', push:bool}
     Niemals automatisch lokale Daten ueber Cloud-Daten schreiben. */
  function decide(remote, local, hasData, label){
    var rHas = !!(remote && hasData(remote));
    var lHas = !!(local  && hasData(local));

    if(rHas && !lHas)  return Promise.resolve({use:'cloud', push:false, sync:true});
    if(!rHas && !lHas) return Promise.resolve({use:'local', push:false, sync:true});  // frisch
    if(rHas && lHas){
      if(JSON.stringify(remote)===JSON.stringify(local))
        return Promise.resolve({use:'cloud', push:false, sync:true});
      return ask(label,
        'Es gibt Daten in der Cloud <b>und</b> abweichende Daten auf diesem Ger\u00e4t.<br>Welche m\u00f6chtest du behalten?',
        [{t:'\u2601 Cloud-Daten verwenden', v:{use:'cloud',push:false,sync:true}, primary:true},
         {t:'\uD83D\uDCBB Ger\u00e4te-Daten hochladen', v:{use:'local',push:true,sync:true}}]);
    }
    // !rHas && lHas -> Erstmigration, aber nur nach Best\u00e4tigung
    return ask(label,
      'Auf diesem Ger\u00e4t liegen Daten, in der Cloud noch keine.<br>Jetzt in die Cloud \u00fcbertragen?',
      [{t:'\u2601 Jetzt \u00fcbertragen', v:{use:'local',push:true,sync:true}, primary:true},
       {t:'Sp\u00e4ter (nur lokal)', v:{use:'local',push:false,sync:false}}]);
  }

  function ask(label, msg, opts){
    return new Promise(function(resolve){
      var ov=document.createElement('div');
      ov.style.cssText='position:fixed;inset:0;z-index:9500;background:rgba(26,26,25,.45);'+
        'backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;';
      var box=document.createElement('div');
      box.style.cssText='background:#fff;border-radius:18px;max-width:440px;width:100%;padding:26px;'+
        'box-shadow:0 24px 60px rgba(26,26,25,.28);font-family:Inter,sans-serif;';
      var btns=opts.map(function(o,i){
        return '<button data-i="'+i+'" style="'+
          'width:100%;font-family:Inter,sans-serif;font-size:13.5px;font-weight:600;padding:12px;'+
          'border-radius:11px;cursor:pointer;margin-top:8px;transition:all .13s;'+
          (o.primary
            ? 'background:#1A1A19;color:#fff;border:none;'
            : 'background:#fff;color:#767674;border:1.5px solid #E9E9E7;')+
          '">'+o.t+'</button>';
      }).join('');
      box.innerHTML=
        '<div style="font-family:DM Mono,monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;'+
          'color:#A3A3A1;margin-bottom:9px;">'+label+'</div>'+
        '<div style="font-size:17px;font-weight:700;letter-spacing:-.02em;color:#1A1A19;margin-bottom:10px;">'+
          'Daten abgleichen</div>'+
        '<div style="font-size:13.5px;color:#767674;line-height:1.55;margin-bottom:16px;">'+msg+'</div>'+
        btns+
        '<div style="font-size:11px;color:#B5B5B3;margin-top:12px;text-align:center;line-height:1.5;">'+
          'Es wird nichts gel\u00f6scht. Deine lokale Kopie bleibt erhalten.</div>';
      ov.appendChild(box);
      box.addEventListener('click',function(e){
        var b=e.target.closest('button[data-i]');
        if(!b)return;
        var choice=opts[parseInt(b.getAttribute('data-i'))].v;
        ov.remove();
        resolve(choice);
      });
      document.body.appendChild(ov);
    });
  }

  return {init:init, ready:ready, disable:disable, decide:decide, load:load, save:save, saveNow:saveNow,
          docGet:docGet, docPut:docPut, docDel:docDel,
          mountBadge:mountBadge, setBadge:setBadge};
})();

var SAVE_KEY = 'moov_lieferungen';
var OLD_KEYS = ['moov_lief6','moov_lief5','moov_lief4','moov_lief3','moov_lief2','moov_lief'];

var ST=null, SORT='manual', SHOW_ALL_TASKS=false;
var CUR={oid:null, did:null, pid:null, plevel:null};
var NEWDELS=[];

/* ── Helpers ── */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return 'x'+Date.now()+Math.floor(Math.random()*1e6);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function n2(v){var n=parseFloat(v);return isNaN(n)?0:n;}
function r2(n){return Math.round(n*100)/100;}
function fa(v,cur){return (cur||'EUR')+' '+n2(v).toLocaleString('de-CH',
  {minimumFractionDigits:2,maximumFractionDigits:2});}
function fnum(v){return n2(v).toLocaleString('de-CH');}
function fd(iso){if(!iso)return '—';var p=iso.split('-');
  return p.length===3?(p[2]+'.'+p[1]+'.'+p[0]):iso;}
function fdShort(iso){if(!iso)return '—';var p=iso.split('-');
  return p.length===3?(p[2]+'.'+p[1]+'.'):iso;}
function addDays(iso,d){if(!iso)return '';var x=new Date(iso+'T00:00:00');
  x.setDate(x.getDate()+d);return x.toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}

/* ── Dokumenttypen ── */
var DOC_TYPES=[
  {id:'labor',       label:'Laborbericht',             level:'order',    req:true,  money:false},
  {id:'auftrag',     label:'Auftragsbestätigung',      level:'order',    req:true,  money:false},
  {id:'proforma',    label:'Proforma-Rechnung',        level:'order',    req:false, money:false},
  {id:'rechnung',    label:'Handelsrechnung',          level:'delivery', req:true,  money:false},
  {id:'evv',         label:'eVV Einfuhr (MWST)',       level:'delivery', req:true,  money:true},
  {id:'zoll',        label:'Zoll-/Speditionsrechnung', level:'delivery', req:true,  money:false},
  {id:'lieferschein',label:'Lieferschein / Packliste', level:'delivery', req:false, money:false},
  {id:'cmr',         label:'CMR / Frachtbrief',        level:'delivery', req:false, money:false},
  {id:'zahlung',     label:'Zahlungsbeleg',            level:'delivery', req:false, money:false},
  {id:'sonstiges',   label:'Sonstiges',                level:'delivery', req:false, money:false}
];
function docLabel(t){var d=DOC_TYPES.find(function(x){return x.id===t;});return d?d.label:'Dokument';}
function docIsMoney(t){var d=DOC_TYPES.find(function(x){return x.id===t;});return !!(d&&d.money);}

var FLAVS=['Zitrone','Orange','Waldbeere','Limited'];
function flavCls(n){return FLAVS.indexOf(n)>=0?('f-'+n):'f-x';}

/* ── Zahlungsregeln ── */
var ANZAHLUNG_PCT=0.30, WOCHEN_VOR=8, TAGE_NACH=14;

/* ── Model ── */
function isAnzahlung(dl){
  if(dl.kind==='anzahlung')return true;
  return /anzahlung|abzahlung/.test((dl.name||'').toLowerCase());
}
function migrate(S){
  if(!S||!Array.isArray(S.orders))return S;
  S.orders.forEach(function(o,i){
    if(o.name===undefined)o.name=o.ref||('Bestellung '+(i+1));
    if(o.unitPrice===undefined)o.unitPrice=0;
    if(o.sortOrder===undefined)o.sortOrder=i;
    if(!Array.isArray(o.attachments))o.attachments=[];
    if(!Array.isArray(o.payments))o.payments=[];
    (o.deliveries||[]).forEach(function(dl){
      if(!Array.isArray(dl.flavors))dl.flavors=[];
      if(!Array.isArray(dl.attachments))dl.attachments=[];
      if(!Array.isArray(dl.payments))dl.payments=[];
      if(dl.shippingCost===undefined)dl.shippingCost=0;
      if(dl.shippingPayer===undefined)dl.shippingPayer='moov';
      if(dl.shipDate===undefined)dl.shipDate=dl.deliveryDate||'';
      if(dl.kind===undefined)dl.kind=isAnzahlung(dl)?'anzahlung':'lieferung';
    });
  });
  return S;
}
function fO(id){return (ST.orders||[]).find(function(o){return o.id===id;});}
function fD(oid,did){var o=fO(oid);return o?(o.deliveries||[]).find(function(d){return d.id===did;}):null;}

/* Alle Zahlungen einer Bestellung, mit Herkunft */
function allPays(o){
  var out=[];
  (o.payments||[]).forEach(function(p){out.push({p:p,dl:null,o:o});});
  (o.deliveries||[]).forEach(function(dl){
    (dl.payments||[]).forEach(function(p){out.push({p:p,dl:dl,o:o});});
  });
  return out;
}
function orderTotals(o){
  var t={soll:0,bezahlt:0,offen:0,ueberfaellig:0,nOffen:0,nUeber:0,versandMoov:0,next:null};
  var h=todayStr();
  allPays(o).forEach(function(e){
    var amt=n2(e.p.amount);t.soll+=amt;
    if(e.p.paidDate){t.bezahlt+=amt;}
    else{
      t.offen+=amt;t.nOffen++;
      if(e.p.dueDate&&e.p.dueDate<h){t.ueberfaellig+=amt;t.nUeber++;}
      if(e.p.dueDate&&(!t.next||e.p.dueDate<t.next.dueDate))t.next=e.p;
    }
  });
  (o.deliveries||[]).forEach(function(dl){
    if(dl.shippingPayer==='moov')t.versandMoov+=n2(dl.shippingCost);
  });
  t.pct=t.soll>0?(t.bezahlt/t.soll*100):0;
  return t;
}
function istAngekommen(dl,h){
  if(n2(dl.stk_received)>0)return true;
  return !!(dl.deliveryDate&&dl.deliveryDate<=(h||todayStr()));
}
function docStatus(o){
  var h=todayStr(),need=[],have=[];
  DOC_TYPES.filter(function(d){return d.level==='order'&&d.req;}).forEach(function(d){
    need.push({t:d.id,label:d.label,scope:'Bestellung',dlId:null,money:d.money});
  });
  (o.attachments||[]).forEach(function(a){have.push('order:'+a.docType);});
  (o.deliveries||[]).forEach(function(dl){
    if(dl.kind==='anzahlung')return;
    if(n2(dl.stk_ordered)>0 && istAngekommen(dl,h)){
      DOC_TYPES.filter(function(d){return d.level==='delivery'&&d.req;}).forEach(function(d){
        need.push({t:d.id,label:d.label,scope:dl.name,dlId:dl.id,money:d.money});
      });
    }
    (dl.attachments||[]).forEach(function(a){have.push(dl.id+':'+a.docType);});
  });
  var miss=need.filter(function(n){return have.indexOf((n.dlId||'order')+':'+n.t)<0;});
  return {need:need.length,have:need.length-miss.length,missing:miss};
}

/* ── Zahlungsplan-Generator ── */
function planFor(stkGesamt,preis,dels){
  var gesamt=r2(n2(stkGesamt)*n2(preis));
  var anz=r2(gesamt*ANZAHLUNG_PCT);
  var out={gesamt:gesamt,anzahlung:anz,rows:[]};
  out.rows.push({ref:'Anzahlung Verpackung '+(ANZAHLUNG_PCT*100)+'%',amount:anz,dueDate:'',lvl:'order'});
  (dels||[]).forEach(function(L){
    var ware=r2(n2(L.stk)*n2(preis));
    var rest=r2(ware*(1-ANZAHLUNG_PCT));
    var rate=r2(rest/2);
    out.rows.push({ref:'Anzahlung 50% · '+L.name,amount:rate,
      dueDate:L.shipDate?addDays(L.shipDate,-WOCHEN_VOR*7):'',lvl:'del',del:L.name});
    out.rows.push({ref:'Restbetrag 50% · '+L.name,amount:r2(rest-rate),
      dueDate:(L.recvDate||L.shipDate)?addDays(L.recvDate||L.shipDate,TAGE_NACH):'',lvl:'del',del:L.name});
  });
  out.summe=r2(out.rows.reduce(function(s,r){return s+r.amount;},0));
  return out;
}

/* ══════════ RENDER ══════════ */
var SEL=null, OPENC={};

function sortedOrders(){
  var a=(ST.orders||[]).slice();
  if(SORT==='ref')a.sort(function(x,y){return String(x.ref||'').localeCompare(String(y.ref||''),'de',{numeric:true});});
  else if(SORT==='open')a.sort(function(x,y){return orderTotals(y).offen-orderTotals(x).offen;});
  else if(SORT==='due')a.sort(function(x,y){
    var a1=orderTotals(x).next,b1=orderTotals(y).next;
    if(!a1&&!b1)return 0; if(!a1)return 1; if(!b1)return -1;
    return String(a1.dueDate).localeCompare(String(b1.dueDate));});
  else a.sort(function(x,y){return n2(x.sortOrder)-n2(y.sortOrder);});
  return a;
}
function openTasks(){
  var h=todayStr(),out=[];
  (ST.orders||[]).forEach(function(o){
    allPays(o).forEach(function(e){
      if(e.p.paidDate)return;
      out.push({o:o,dl:e.dl,p:e.p,late:!!(e.p.dueDate&&e.p.dueDate<h)});
    });
  });
  out.sort(function(a,b){
    if(a.late!==b.late)return a.late?-1:1;
    return String(a.p.dueDate||'9999').localeCompare(String(b.p.dueDate||'9999'));
  });
  return out;
}
function delTotals(dl){
  var t={soll:0,bez:0,offen:0,late:0},h=todayStr();
  (dl.payments||[]).forEach(function(p){
    var a=n2(p.amount);t.soll+=a;
    if(p.paidDate)t.bez+=a;
    else{t.offen+=a;if(p.dueDate&&p.dueDate<h)t.late+=a;}
  });
  return t;
}
/* Dokument-Status je Lieferung */
function delDocs(o,dl){
  if(dl.kind==='anzahlung')return [];
  if(n2(dl.stk_ordered)<=0)return [];   // Dienstleistung: keine Zollpapiere
  var ang=istAngekommen(dl);
  return DOC_TYPES.filter(function(d){return d.level==='delivery';}).map(function(d){
    var atts=(dl.attachments||[]).filter(function(a){return a.docType===d.id;});
    return {t:d.id,label:d.label,req:d.req,money:d.money,atts:atts,
            need:d.req&&ang, state:atts.length?'y':((d.req&&ang)?'n':'o')};
  });
}
function render(){
  if(!ST)return;
  document.getElementById('today').textContent=fd(todayStr());
  var list=sortedOrders();
  if(!SEL||!fO(SEL))SEL=list.length?list[0].id:null;
  renderKpis(); renderOrders(); renderDetail(); renderZplan();
  renderTasks(); renderCash(); renderDocs(); renderPlan();
}
function renderKpis(){
  var soll=0,bez=0,off=0,ueb=0,nUeb=0,in30=0,n30=0,nextDel=null;
  var h=todayStr(),grenze=addDays(h,30);
  (ST.orders||[]).forEach(function(o){
    var t=orderTotals(o);soll+=t.soll;bez+=t.bezahlt;off+=t.offen;ueb+=t.ueberfaellig;nUeb+=t.nUeber;
    allPays(o).forEach(function(e){
      if(e.p.paidDate||!e.p.dueDate)return;
      if(e.p.dueDate>=h&&e.p.dueDate<=grenze){in30+=n2(e.p.amount);n30++;}
    });
    (o.deliveries||[]).forEach(function(dl){
      if(dl.kind==='anzahlung')return;
      if(dl.deliveryDate&&dl.deliveryDate>=h){
        if(!nextDel||dl.deliveryDate<nextDel.d)nextDel={d:dl.deliveryDate,stk:n2(dl.stk_ordered),ref:o.ref};
      }
    });
  });
  var pct=soll>0?(bez/soll*100):0;
  var cur=(ST.orders&&ST.orders[0]&&ST.orders[0].currency)||'EUR';
  document.getElementById('kpis').innerHTML=
    '<div class="k"><div class="kl">Offen gesamt</div><div class="kv">'+fa(off,cur)+'</div>'+
      '<div class="ks">von '+fa(soll,cur)+' · '+pct.toFixed(0)+'% bezahlt</div></div>'+
    '<div class="k '+(ueb>0?'alert':'ok')+'"><div class="kl">Überfällig</div>'+
      '<div class="kv">'+(ueb>0?fa(ueb,cur):'—')+'</div>'+
      '<div class="ks">'+(ueb>0?(nUeb+' Zahlung'+(nUeb>1?'en':'')):'nichts überfällig')+'</div></div>'+
    '<div class="k warn"><div class="kl">Nächste 30 Tage</div><div class="kv">'+fa(in30,cur)+'</div>'+
      '<div class="ks">'+n30+' Zahlung'+(n30===1?'':'en')+' fällig</div></div>'+
    '<div class="k ok"><div class="kl">Nächste Lieferung</div>'+
      '<div class="kv">'+(nextDel?fdShort(nextDel.d):'—')+'</div>'+
      '<div class="ks">'+(nextDel?(fnum(nextDel.stk)+' Stk · '+esc(nextDel.ref)):'keine geplant')+'</div></div>';
}
function renderOrders(){

    '<div class="empty">Noch keine Bestellung.<br><br>'+
    '<button class="btn dark" onclick="openNew()">+ Bestellung anlegen</button></div>';return;}
  document.getElementById('orders').innerHTML=a.map(function(o){
    var t=orderTotals(o),cur=o.currency||'EUR';
    var nDel=(o.deliveries||[]).filter(function(d){return d.kind!=='anzahlung';}).length;
    var tag = t.nUeber>0 ? '<span class="tag tg-late">'+t.nUeber+' überfällig</span>'
            : (t.offen<=0 ? '<span class="tag tg-ok">bezahlt</span>'
            : '<span class="tag tg-open">offen</span>');

      '<span class="grip" onclick="event.stopPropagation()">'+(SORT==='manual'?'&#x283F;':'')+'</span>'+
      '<span><span class="n">'+esc(o.ref||o.name)+' '+tag+'</span>'+
        '<span class="meta">'+nDel+' Lieferung'+(nDel===1?'':'en')+' · '+
          fnum(o.totalUnits||0)+' Stk</span>'+
        '<span class="pbar"><i style="width:'+Math.min(100,t.pct).toFixed(0)+'%;background:'+col+'"></i></span></span>'+
      '<span class="r"><span class="tot">'+fa(t.offen,cur)+'</span></span></div>';
  }).join('');
  if(SORT==='manual')wireDrag();
}
function selectOrder(id){SEL=id;OPENC={};render();}

/* ══ DETAIL ══ */
function renderDetail(){
  var o=SEL?fO(SEL):null;
  var head=document.getElementById('dtHead'),cnt=document.getElementById('dtCnt');
  if(!o){head.textContent='Bestellung';cnt.textContent='';
    document.getElementById('detail').innerHTML='<div class="empty">Links eine Bestellung wählen.</div>';return;}
  var cur=o.currency||'EUR',t=orderTotals(o);
  head.textContent=o.ref||o.name;
  var dels=(o.deliveries||[]).slice().sort(function(a,b){
    if(a.kind==='anzahlung'&&b.kind!=='anzahlung')return -1;
    if(b.kind==='anzahlung'&&a.kind!=='anzahlung')return 1;
    return String(a.deliveryDate||'9999').localeCompare(String(b.deliveryDate||'9999'));});
  cnt.textContent=dels.length+' Positionen';

  var stkGel=dels.reduce(function(s,d){return s+n2(d.stk_received);},0);
  var stkBes=dels.reduce(function(s,d){return s+n2(d.stk_ordered);},0);

  var h='<div class="dt-head">'+
    '<div class="dt-title">'+esc(o.ref||o.name)+
      (t.nUeber>0?' <span class="tag tg-late">'+t.nUeber+' überfällig</span>':'')+
      ' <button class="btn xs" onclick="openOrder(\''+o.id+'\')">Bearbeiten</button></div>'+
    '<div class="dt-sub">'+esc(o.supplier||'')+
      (o.unitPrice?' · '+fnum(o.totalUnits)+' Stk × '+fa(o.unitPrice,cur):'')+
      (o.zahlungskonditionen?'<br>'+esc(o.zahlungskonditionen):'')+'</div>'+
    '<div class="dt-stats">'+
      '<div class="dt-stat"><div class="l">Auftragswert</div><div class="v">'+fa(t.soll,cur)+'</div></div>'+
      '<div class="dt-stat"><div class="l">Bezahlt</div><div class="v g">'+fa(t.bezahlt,cur)+'</div></div>'+
      '<div class="dt-stat"><div class="l">Offen</div><div class="v'+(t.offen>0?' r':'')+'">'+fa(t.offen,cur)+'</div></div>'+
      '<div class="dt-stat"><div class="l">Wareneingang</div><div class="v">'+fnum(stkGel)+' / '+fnum(stkBes)+'</div></div>'+
    '</div></div>';

  h+=dels.map(function(dl){return delCard(o,dl,cur);}).join('');
  h+='<div style="padding:4px 12px 14px"><button class="btn sm" onclick="addDelivery(\''+o.id+'\')">+ Teillieferung</button></div>';
  document.getElementById('detail').innerHTML=h;
}
function delCard(o,dl,cur){
  var t=delTotals(dl),open=!!OPENC[dl.id];
  var cls = dl.kind==='anzahlung' ? 'anz'
          : (t.late>0 ? 'late' : (t.offen<=0&&t.soll>0 ? 'paid' : 'part'));
  var docs=delDocs(o,dl);
  var missing=docs.filter(function(d){return d.state==='n';}).length;
  var haveN=docs.filter(function(d){return d.state==='y';}).length;
  var reqN=docs.filter(function(d){return d.req;}).length;

  var badges='';
  if(dl.kind==='anzahlung')badges+='<span class="tag tg-info">Anzahlung</span>';
  if(t.soll>0&&t.offen<=0)badges+='<span class="tag tg-ok">Bezahlt</span>';
  else if(t.late>0)badges+='<span class="tag tg-late">Überfällig</span>';
  else if(t.bez>0)badges+='<span class="tag tg-open">Teilweise</span>';
  if(n2(dl.stk_ordered)>0)badges+='<span class="tag tg-grey">'+fnum(dl.stk_received)+'/'+fnum(dl.stk_ordered)+'</span>';
  if(missing>0)badges+='<span class="tag tg-late">'+missing+' Dok. fehlt</span>';
  else if(reqN>0&&dl.kind!=='anzahlung')badges+='<span class="tag tg-ok">Dok. ✓</span>';

  var meta=[];
  if(dl.deliveryDate)meta.push(fd(dl.deliveryDate));
  if(n2(dl.stk_ordered)>0)meta.push(fnum(dl.stk_ordered)+' Stk');
  if(n2(dl.netPrice)>0)meta.push('Netto '+fa(dl.netPrice,cur));
  if(dl.rechnungNr)meta.push('Rg. '+esc(dl.rechnungNr));

  var body='';
  if(open){
    var pct=n2(dl.stk_ordered)>0?(n2(dl.stk_received)/n2(dl.stk_ordered)*100):0;
    body='<div class="dc-body">';
    if(dl.kind!=='anzahlung'&&n2(dl.stk_ordered)>0){
      body+='<div class="we"><div><div class="we-l">Wareneingang</div>'+
        '<div class="we-bar"><i style="width:'+Math.min(100,pct).toFixed(0)+'%"></i></div>'+
        '<div class="we-s">'+fnum(dl.stk_received)+' von '+fnum(dl.stk_ordered)+' Stk ('+pct.toFixed(0)+'%)</div></div>'+
        '<button class="btn sm" onclick="bookIn(\''+o.id+'\',\''+dl.id+'\')">Eingang buchen</button></div>';
    }
    body+='<div class="chips">';
    if(n2(dl.netPrice)>0)body+='<span class="chip">Netto <b>'+fa(dl.netPrice,cur)+'</b></span>';
    if(n2(dl.shippingCost)>0)body+='<span class="chip">Versand <b>'+fa(dl.shippingCost,cur)+'</b>'+
      (dl.shippingPayer==='svz'?' <span class="tag tg-info">SVZ</span>':'')+'</span>';
    if(n2(dl.verpackungEUR)>0)body+='<span class="chip">Verpackung <b>'+fa(dl.verpackungEUR,cur)+'</b></span>';
    if(n2(dl.rechnungsbetragEUR)>0)body+='<span class="chip">Rechnung <b>'+fa(dl.rechnungsbetragEUR,cur)+'</b></span>';
    if(dl.gewichtBrutto)body+='<span class="chip">Brutto <b>'+fnum(dl.gewichtBrutto)+' kg</b></span>';
    if(dl.paletten)body+='<span class="chip">Paletten <b>'+dl.paletten+'</b></span>';
    if(dl.incoterm)body+='<span class="chip">'+esc(dl.incoterm)+'</span>';
    body+='</div>';

    if((dl.flavors||[]).length){
      body+='<div class="sect">Geschmäcker</div><div>'+
        dl.flavors.map(function(f){
          return '<span class="fpill '+flavCls(f.name)+'">'+esc(f.name)+' '+fnum(f.qty)+'</span>';
        }).join('')+'</div>';
    }
    if(dl.evvNummer){
      body+='<div class="sect">Verzollung</div><div class="chips">'+
        '<span class="chip">eVV <b>'+esc(dl.evvNummer)+'</b></span>'+
        (dl.spediteur?'<span class="chip">'+esc(dl.spediteur)+'</span>':'')+
        (dl.einfuhrsteuerCHF!=null?'<span class="chip">Einfuhrsteuer <b>CHF '+fnum(dl.einfuhrsteuerCHF)+'</b></span>':'')+
        (dl.zollCHF!=null?'<span class="chip">Zoll <b>CHF '+fnum(dl.zollCHF)+'</b></span>':'')+
        '<span class="chip">'+(dl.praeferenz?'Präferenz ✓':'<span style="color:var(--red)">Präferenz ✗</span>')+'</span>'+
        '</div>';
    }

    body+='<div class="sect">Zahlungen<span class="r">'+
      '<button class="btn xs" onclick="addPaymentTo(\''+o.id+'\',\''+dl.id+'\')">+ Zahlung</button></span></div>';
    if((dl.payments||[]).length){
      body+='<div class="ptab">'+dl.payments.slice().sort(function(a,b){
        return String(a.dueDate||'').localeCompare(String(b.dueDate||''));
      }).map(function(p){
        var late=!p.paidDate&&p.dueDate&&p.dueDate<todayStr();
        return '<div class="ptr'+(late?' late':(p.paidDate?' paid':''))+'">'+
          '<span><span style="font-weight:500">'+esc(p.ref||'Zahlung')+'</span>'+
            '<span class="pd">'+(p.paidDate?('bezahlt '+fdShort(p.paidDate)):
              (p.dueDate?('fällig '+fdShort(p.dueDate)):'Termin offen'))+'</span></span>'+
          '<span>'+(p.paidDate?'<span class="tag tg-ok">Bezahlt</span>':
            (late?'<span class="tag tg-late">Überfällig</span>':'<span class="tag tg-open">Offen</span>'))+'</span>'+
          '<span class="pa">'+fa(p.amount,cur)+'</span>'+
          '<button class="ib" onclick="openPayment(\''+o.id+'\',\''+dl.id+'\',\''+p.id+'\')">&#x270F;</button></div>';
      }).join('')+'</div>';
    } else body+='<div class="empty" style="padding:12px">Keine Zahlung erfasst.</div>';

    if(dl.kind!=='anzahlung'){
      body+='<div class="sect">Dokumente <span style="color:var(--tx3)">'+haveN+'/'+reqN+' Pflicht</span></div>'+
        '<div class="docs">'+docs.map(function(d){
          var icon=d.state==='y'?'<span class="dst y">&#x2713;</span>':
                   (d.state==='n'?'<span class="dst n">!</span>':'<span class="dst o">·</span>');
          var head='<div class="drow'+(d.state==='n'?' miss':'')+(d.state==='o'?' opt':'')+'">'+icon+
            '<span><span class="dl-n">'+esc(d.label)+
              (d.atts.length>1?' <span class="tag tg-grey">'+d.atts.length+'</span>':'')+'</span><br>'+
              '<span class="dl-s">'+(d.atts.length?(d.atts.length+' Datei'+(d.atts.length>1?'en':'')):
                (d.need?(d.money?'Pflicht · Geld':'Pflicht'):'optional'))+'</span></span>'+
            '<button class="ib" onclick="openDoc(\''+o.id+'\',\''+dl.id+'\',\''+d.t+'\')" title="Datei hinzufügen">+</button></div>';
          var files=d.atts.map(function(a){
            return '<div class="drow" style="margin-left:26px;background:var(--sur)">'+
              '<span class="dst o">&#x1F4C4;</span>'+
              '<span><span class="dl-n">'+esc(a.name)+'</span><br>'+
                '<span class="dl-s">'+Math.round((a.size||0)/1024)+' KB · '+fdShort(a.date)+'</span></span>'+
              '<span><button class="ib" onclick="viewDoc(\''+a.id+'\')">&#x2197;</button>'+
              '<button class="ib del" onclick="rmDoc(\''+o.id+'\',\''+dl.id+'\',\''+a.id+'\')">&#x2715;</button></span></div>';
          }).join('');
          return head+files;
        }).join('')+'</div>';
    }
    if(dl.bemerkung)body+='<div class="sect">Notiz</div><div style="font-size:11.5px;color:var(--tx2)">'+esc(dl.bemerkung)+'</div>';
    body+='<div class="dacts">'+
      '<button class="btn xs" onclick="openDelivery(\''+o.id+'\',\''+dl.id+'\')">Bearbeiten</button>'+
      '<span style="flex:1"></span>'+
      '<button class="btn xs danger" onclick="delDeliveryFrom(\''+o.id+'\',\''+dl.id+'\')">Löschen</button></div>';
    body+='</div>';
  }

  return '<div class="dcard '+cls+(open?' open':'')+'">'+
    '<div class="dc-head" onclick="toggleCard(\''+dl.id+'\')">'+
      '<span><span class="dc-n">'+esc(dl.name)+' '+badges+'</span>'+
        '<span class="dc-m">'+meta.join(' · ')+'</span></span>'+
      '<span class="dc-a">'+fa(t.soll,cur)+'</span>'+
      '<button class="dc-x">'+(open?'&#x25B2;':'&#x25BC;')+'</button>'+
    '</div>'+body+'</div>';
}
function toggleCard(id){OPENC[id]=!OPENC[id];renderDetail();}
function toggleAllCards(){
  var o=SEL?fO(SEL):null;if(!o)return;
  var anyClosed=(o.deliveries||[]).some(function(d){return !OPENC[d.id];});
  (o.deliveries||[]).forEach(function(d){OPENC[d.id]=anyClosed;});
  document.getElementById('dtToggle').textContent=anyClosed?'alle zuklappen':'alle aufklappen';
  renderDetail();
}
function bookIn(oid,did){
  event.stopPropagation();
  var dl=fD(oid,did);if(!dl)return;
  var v=prompt('Wie viele Stück sind eingetroffen?',dl.stk_ordered||'');
  if(v===null)return;
  dl.stk_received=n2(v);
  if(!dl.deliveryDate)dl.deliveryDate=todayStr();
  sv();render();
}
function addPaymentTo(oid,did){
  event.stopPropagation();
  var dl=fD(oid,did);if(!dl)return;
  if(!Array.isArray(dl.payments))dl.payments=[];
  var p={id:uid(),ref:'Neue Zahlung',desc:dl.name,amount:0,amount_paid:0,
    dueDate:'',paidDate:'',notes:''};
  dl.payments.push(p);sv();render();
  openPayment(oid,did,p.id);
}
function delDeliveryFrom(oid,did){
  event.stopPropagation();
  var o=fO(oid),dl=fD(oid,did);if(!o||!dl)return;
  if(!confirm('Lieferung "'+dl.name+'" löschen?'))return;
  o.deliveries=o.deliveries.filter(function(d){return d.id!==did;});
  sv();render();
}

/* ══ ZAHLUNGSPLAN ══ */
function renderZplan(){
  var h=todayStr(),html='';
  sortedOrders().forEach(function(o){
    var cur=o.currency||'EUR';
    var offen=allPays(o).filter(function(e){return !e.p.paidDate;});
    var t=orderTotals(o);
    if(!offen.length&&t.offen<=0)return;
    offen.sort(function(a,b){return String(a.p.dueDate||'9999').localeCompare(String(b.p.dueDate||'9999'));});
    var col=t.nUeber>0?'var(--red)':(t.offen<=0?'var(--green)':'var(--amber)');
    html+='<div class="zp-o"><div class="zp-h"><span class="n">'+esc(o.ref||o.name)+'</span>'+
      '<span class="a">'+fa(t.offen,cur)+'</span></div>'+
      '<div class="zp-bar"><i style="width:'+Math.min(100,t.pct).toFixed(0)+'%;background:'+col+'"></i></div>'+
      offen.slice(0,7).map(function(e){
        var late=e.p.dueDate&&e.p.dueDate<h;
        return '<div class="zp-r'+(late?' late':'')+'">'+
          '<span class="d">'+(e.p.dueDate?fdShort(e.p.dueDate):'offen')+'</span>'+
          '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
            esc(e.p.ref||'Zahlung')+(e.dl?' · '+esc(e.dl.name):'')+'</span>'+
          '<span class="m">'+fa(e.p.amount,cur)+'</span></div>';
      }).join('')+
      (offen.length>7?'<div class="zp-r"><span class="d"></span><span style="color:var(--tx3)">+ '+
        (offen.length-7)+' weitere</span><span class="m"></span></div>':'')+
    '</div>';
  });
  document.getElementById('zplan').innerHTML=html||'<div class="empty">Nichts offen.</div>';
}

function renderTasks(){
  var all=openTasks();
  var list=SHOW_ALL_TASKS?all:all.slice(0,7);
  document.getElementById('taskCnt').textContent=all.length;
  var tt=document.getElementById('taskToggle');
  if(tt){tt.textContent=SHOW_ALL_TASKS?'weniger':('alle '+all.length+' zeigen');
    tt.style.display=all.length>7?'':'none';}
  if(!all.length){document.getElementById('tasks').innerHTML=
    '<div class="empty">Nichts offen. Alle Zahlungen erledigt.</div>';return;}
  document.getElementById('tasks').innerHTML=list.map(function(t){
    var cur=t.o.currency||'EUR';
    var sub=(t.dl?esc(t.dl.name)+' · ':'')+esc(t.o.ref||t.o.name);
    var extra='';
    if(t.late&&t.p.dueDate)extra=' · '+daysBetween(t.p.dueDate,todayStr())+' Tage';
    return '<div class="task'+(t.late?' late':'')+'">'+
      '<span class="d">'+fdShort(t.p.dueDate)+'</span>'+
      '<span><span class="t">'+esc(t.p.ref||'Zahlung')+'</span>'+
        '<span class="sub">'+sub+extra+'</span></span>'+
      '<span class="amt">'+fa(t.p.amount,cur)+'</span>'+
      '<button class="btn sm" onclick="markPaid(\''+t.o.id+'\',\''+(t.dl?t.dl.id:'')+'\',\''+t.p.id+'\')">Bezahlt</button>'+
    '</div>';
  }).join('');
}
function renderCash(){
  var h=todayStr(),buckets={},cur='EUR';
  (ST.orders||[]).forEach(function(o){
    cur=o.currency||cur;
    allPays(o).forEach(function(e){
      if(e.p.paidDate||!e.p.dueDate)return;
      var k=e.p.dueDate.slice(0,7);
      buckets[k]=(buckets[k]||0)+n2(e.p.amount);
    });
  });
  var keys=Object.keys(buckets).sort();
  if(!keys.length){document.getElementById('cash').innerHTML=
    '<div class="empty">Keine offenen Zahlungen mit Termin.</div>';return;}
  var max=Math.max.apply(null,keys.map(function(k){return buckets[k];}));
  var M=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  document.getElementById('cash').innerHTML=keys.map(function(k){
    var p=k.split('-'),lbl=M[parseInt(p[1],10)-1]+' '+p[0].slice(2);
    var hot=k<=h.slice(0,7);
    return '<div class="cfrow"><span class="cfm">'+lbl+'</span>'+
      '<span class="cftrack"><i class="'+(hot?'hot':'')+'" style="width:'+
        (buckets[k]/max*100).toFixed(0)+'%"></i></span>'+
      '<span class="cfv">'+n2(buckets[k]).toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2})+'</span></div>';
  }).join('');
}
function renderDocs(){
  var a=sortedOrders(),totalMiss=0;
  var html=a.map(function(o){
    var d=docStatus(o);totalMiss+=d.missing.length;
    var pct=d.need>0?(d.have/d.need*100):100;
    var chips=d.missing.length
      ? d.missing.slice(0,4).map(function(m){
          return '<span class="dchip" onclick="openDoc(\''+o.id+'\',\''+
            (m.dlId||'')+'\',\''+m.t+'\')">'+esc(m.label)+' · '+esc(m.scope)+'</span>';
        }).join('')+(d.missing.length>4?'<span class="dchip" onclick="selectOrder(\''+o.id+'\')">+'+(d.missing.length-4)+' weitere</span>':'')
      : '<span class="dchip ok">vollständig</span>';
    return '<div class="doc"><div class="doch"><span class="nm">'+esc(o.ref||o.name)+'</span>'+
      '<span class="ct">'+d.have+' / '+d.need+'</span></div>'+
      '<div class="dbar"><i style="width:'+pct.toFixed(0)+'%"></i></div>'+
      '<div class="dmiss">'+chips+'</div></div>';
  }).join('');
  document.getElementById('docs').innerHTML=html||'<div class="empty">Keine Bestellungen.</div>';
  document.getElementById('docCnt').textContent=totalMiss?(totalMiss+' fehlen'):'vollständig';
}
function renderPlan(){
  var h=todayStr(),rows=[];
  (ST.orders||[]).forEach(function(o){
    (o.deliveries||[]).forEach(function(dl){
      if(dl.kind==='anzahlung')return;
      if(!dl.deliveryDate||dl.deliveryDate<h)return;
      rows.push({o:o,dl:dl});
    });
  });
  rows.sort(function(a,b){return a.dl.deliveryDate.localeCompare(b.dl.deliveryDate);});
  if(!rows.length){document.getElementById('plan').innerHTML=
    '<div class="empty">Keine kommenden Lieferungen.</div>';return;}
  document.getElementById('plan').innerHTML=rows.map(function(r){
    var dl=r.dl,tot=n2(dl.stk_ordered)||1;
    var fl=(dl.flavors||[]).filter(function(f){return n2(f.qty)>0;});
    var stack = fl.length
      ? fl.map(function(f){
          return '<span class="'+flavCls(f.name)+'" style="width:'+
            Math.max(7,(n2(f.qty)/tot*100)).toFixed(1)+'%">'+esc(f.name.slice(0,3))+' '+fnum(f.qty)+'</span>';
        }).join('')
      : '<span class="f-x" style="width:100%">'+fnum(dl.stk_ordered)+' Stk</span>';
    var late = dl.shipDate && dl.deliveryDate && dl.deliveryDate>dl.shipDate
      ? '<span class="tag tg-info">verschoben</span>' : '';
    return '<div class="dl" style="cursor:pointer" onclick="selectOrder(\''+r.o.id+'\')">'+
      '<span class="d">'+fdShort(dl.deliveryDate)+'</span>'+
      '<span class="stack">'+stack+'</span>'+
      '<span>'+esc(r.o.ref||'')+' '+late+'</span></div>';
  }).join('');
}

/* ══════════ AKTIONEN ══════════ */
function setSort(v){SORT=v;render();}
function toggleAllTasks(){SHOW_ALL_TASKS=!SHOW_ALL_TASKS;renderTasks();}
function markPaid(oid,did,pid){
  event.stopPropagation();
  var o=fO(oid);if(!o)return;
  var list=did?(fD(oid,did)||{}).payments:o.payments;
  var p=(list||[]).find(function(x){return x.id===pid;});
  if(!p)return;
  p.paidDate=todayStr();
  if(!n2(p.amount_paid))p.amount_paid=n2(p.amount);

    '<div id="docExisting" style="margin-top:6px"></div>';

function uploadDoc(input,dtype){
  var files=input.files?Array.prototype.slice.call(input.files):[];
  if(!files.length)return;
  var st=document.getElementById('docStatus');
  if(!PS.ready()){
    st.innerHTML='<span style="color:var(--red)">Keine Cloud-Verbindung — Datei nicht gespeichert.</span>';
    return;
  }
  var target=CUR.did?fD(CUR.oid,CUR.did):fO(CUR.oid);
  if(!target){st.innerHTML='<span style="color:var(--red)">Ziel nicht gefunden.</span>';return;}
  if(!Array.isArray(target.attachments))target.attachments=[];

  var done=0,failed=0,total=files.length;
  st.innerHTML='<span style="color:var(--amber)">Lade '+total+' Datei'+(total>1?'en':'')+' hoch…</span>';

  function one(file){
    return new Promise(function(res){
      var fr=new FileReader();
      fr.addEventListener('load',function(ev){
        var b64=String(ev.target.result).split(',')[1];
        var attId=uid();
        var meta={id:attId,name:file.name,docType:dtype,date:todayStr(),
          size:file.size,mimeType:file.type||'application/pdf'};
        PS.docPut(attId,b64,meta.mimeType).then(function(){
          target.attachments.push(meta);done++;res();
        }).catch(function(){failed++;res();});
      });
      fr.readAsDataURL(file);
    });
  }
  // nacheinander hochladen, dann Zählung im Modal aktualisieren
  files.reduce(function(p,f){return p.then(function(){return one(f);});},Promise.resolve())
    .then(function(){
      sv();render();
      input.value='';
      var have=target.attachments.filter(function(a){return a.docType===dtype;}).length;
      st.innerHTML='<span style="color:var(--green)">&#x2714; '+done+' gespeichert'+
        (failed?(' · <span style="color:var(--red)">'+failed+' fehlgeschlagen</span>'):'')+
        ' — insgesamt '+have+' Datei'+(have>1?'en':'')+' bei diesem Dokument.</span>';
      renderDocModalList(dtype);
    });
}
/* Liste bereits hochgeladener Dateien im offenen Dokument-Modal */
function renderDocModalList(dtype){
  var box=document.getElementById('docExisting');if(!box)return;
  var target=CUR.did?fD(CUR.oid,CUR.did):fO(CUR.oid);
  var atts=(target&&target.attachments||[]).filter(function(a){return a.docType===dtype;});
  if(!atts.length){box.innerHTML='';return;}
  box.innerHTML='<div class="lbl">Bereits hochgeladen ('+atts.length+')</div>'+
    atts.map(function(a){
      return '<div class="row"><span class="rt">'+esc(a.name)+
        '<span class="rs">'+Math.round((a.size||0)/1024)+' KB · '+fdShort(a.date)+'</span></span>'+
        '<button class="ib" onclick="viewDoc(\''+a.id+'\')">&#x2197;</button>'+
        '<button class="ib del" onclick="rmDocModal(\''+a.id+'\',\''+dtype+'\')">&#x2715;</button></div>';
    }).join('');
}
function rmDocModal(attId,dtype){
  if(!confirm('Diese Datei entfernen?'))return;
  var target=CUR.did?fD(CUR.oid,CUR.did):fO(CUR.oid);
  if(target)target.attachments=(target.attachments||[]).filter(function(a){return a.id!==attId;});
  if(PS.ready())PS.docDel(attId).catch(function(e){console.error(e);});
  sv();render();renderDocModalList(dtype);

async function viewDoc(attId){
  event&&event.stopPropagation&&event.stopPropagation();
  var rec=null;
  if(PS.ready()){try{rec=await PS.docGet(attId);}catch(e){console.error(e);}}
  if(!rec||!rec.data){alert('Datei nicht gefunden.');return;}
  try{
    var bs=atob(rec.data),arr=new Uint8Array(bs.length);
    for(var i=0;i<bs.length;i++)arr[i]=bs.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([arr],{type:rec.mimeType||'application/pdf'}));
    window.open(url,'_blank');
    setTimeout(function(){URL.revokeObjectURL(url);},10000);
  }catch(e){alert('Fehler: '+e.message);}
}
function rmDoc(oid,did,attId){
  event&&event.stopPropagation&&event.stopPropagation();
  if(!confirm('Dokument entfernen?'))return;
  var target=did?fD(oid,did):fO(oid);
  if(target)target.attachments=(target.attachments||[]).filter(function(a){return a.id!==attId;});
  if(PS.ready())PS.docDel(attId).catch(function(e){console.error(e);});
  sv();render();
  if(!did&&document.getElementById('ovOrd').classList.contains('on'))openOrder(oid);
}

/* ── Drag & Drop ── */
var dragEl=null;
function wireDrag(){
  var list=document.getElementById('orders');
  if(!list||list._wired)return;
  list._wired=true;
  list.addEventListener('dragstart',function(e){
    var o=e.target.closest('.ord');if(!o)return;
    dragEl=o;o.classList.add('dragging');
  });
  list.addEventListener('dragend',function(){
    if(dragEl)dragEl.classList.remove('dragging');
    document.querySelectorAll('.ord').forEach(function(x){x.classList.remove('over');});
    dragEl=null;persistOrder();
  });
  list.addEventListener('dragover',function(e){
    e.preventDefault();
    var o=e.target.closest('.ord');if(!o||o===dragEl)return;
    document.querySelectorAll('.ord').forEach(function(x){x.classList.remove('over');});
    o.classList.add('over');
    var r=o.getBoundingClientRect();
    list.insertBefore(dragEl,((e.clientY-r.top)/r.height>0.5)?o.nextSibling:o);
  });
}
function persistOrder(){
  var ids=Array.prototype.map.call(document.querySelectorAll('#orders .ord'),
    function(e){return e.getAttribute('data-id');});
  ids.forEach(function(id,i){var o=fO(id);if(o)o.sortOrder=i;});
  sv();render();
}

/* ── Speichern ── */
function mirrorLocal(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(ST));}catch(e){}}
function sv(){mirrorLocal();PS.save(SAVE_KEY,ST);}

function loadState(){
  var keys=[SAVE_KEY].concat(OLD_KEYS);
  for(var i=0;i<keys.length;i++){
    try{
      var raw=localStorage.getItem(keys[i]);
      if(raw){var p=JSON.parse(raw);
        if(p&&Array.isArray(p.orders)){ST=p;return;}}
    }catch(e){}
  }
  ST={orders:[]};
}
function hasRealLiefData(S){
  return !!(S&&Array.isArray(S.orders)&&S.orders.length>0);
}
function psMigrationError(e,bereich){
  var msg=(e&&e.message)?e.message:String(e);
  var hint='';
  if(/row-level security|RLS|permission denied/i.test(msg))
    hint='\n\nUrsache: Row Level Security blockiert den Zugriff.\nIn Supabase ausführen:\n\n'+
      'ALTER TABLE portal_state DISABLE ROW LEVEL SECURITY;\nALTER TABLE portal_docs DISABLE ROW LEVEL SECURITY;';
  else if(/does not exist|Could not find the table/i.test(msg))
    hint='\n\nUrsache: Tabelle portal_state fehlt.';
  alert('\u26A0 '+bereich+': Daten konnten NICHT in die Cloud übertragen werden.\n\nFehler: '+msg+hint+
    '\n\nDeine lokalen Daten sind unverändert.');
}

(async function boot(){
  PS.init();PS.mountBadge();
  loadState();
  var local=ST,remote=null,loadFailed=false;
  if(PS.ready()){
    try{remote=await PS.load(SAVE_KEY);}
    catch(e){loadFailed=true;console.error('Laden fehlgeschlagen:',e.message);PS.setBadge('err',e.message);}
  }
  if(loadFailed){PS.disable();ST=local;}
  else if(!PS.ready()){ST=local;}
  else{
    var d=await PS.decide(remote,local,hasRealLiefData,'Lieferungen');
    ST=(d.use==='cloud'&&remote)?remote:local;
    if(d.push){
      try{await PS.saveNow(SAVE_KEY,ST);}
      catch(e){PS.disable();psMigrationError(e,'Lieferungen');}
    }
    if(d.sync===false)PS.disable();
  }
  if(!ST||!Array.isArray(ST.orders))ST={orders:[]};
  migrate(ST);
  mirrorLocal();
  render();
})();

document.addEventListener('keydown',function(e){
  if(e.key==='Escape')document.querySelectorAll('.ov').forEach(function(o){o.classList.remove('on');});
});

</script>
